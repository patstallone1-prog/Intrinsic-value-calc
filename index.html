        Math.max(0.74 - ledger.signals.durability.effective, 0) * 0.9 -
        Math.max(0.7 - margins.grossMargin, 0) * 0.45 -
        Math.max(input.competitionIntensity - 2.5, 0) * 0.06 -
        ledger.signals.tagStackingPressure.effective * 0.18 -
        (1 - input.recurringRevenuePct) * 0.08 +
        Math.max(ledger.signals.durability.effective - 0.82, 0) * 0.22,
      0.62,
      1.08
    )
    : 1
  const interp = ([low, high], pos) => low + (high - low) * pos
  const revMultiplier = 0.98 + ledger.signals.coreFinancialJustification.effective * 0.07 + ledger.signals.revenueQuality.effective * 0.07 + ledger.signals.marketPotential.effective * 0.09 + ledger.signals.pipelineOpportunity.effective * 0.035 + ledger.signals.durability.effective * 0.06 - ledger.signals.marketMultiplePressure.effective * 0.06
  const ebitdaMultiplier = 0.98 + ledger.signals.coreFinancialJustification.effective * 0.09 + ledger.signals.profitabilityQuality.effective * 0.04 + ledger.signals.marketPotential.effective * 0.03 + ledger.signals.durability.effective * 0.04 - ledger.signals.marketMultiplePressure.effective * 0.055
  const fcfMultiplier = 0.98 + ledger.signals.coreFinancialJustification.effective * 0.09 + ledger.signals.profitabilityQuality.effective * 0.045 + ledger.signals.revenueQuality.effective * 0.03 + ledger.signals.durability.effective * 0.04 - ledger.signals.marketMultiplePressure.effective * 0.055
  return {
    evRevenue: round(softBand(interp(base.rev, revPosition) * revMultiplier * capitalDrag * tagBudget * sizeAndCompanyFactor * softwareDurabilityGate, base.rev[0], base.rev[1])),
    evEbitda: round(base.ebitda[1] > 0 ? softBand(interp(base.ebitda, ebitdaPosition) * ebitdaMultiplier * capitalDrag * sizeAndCompanyFactor * softwareDurabilityGate, base.ebitda[0], base.ebitda[1]) : 0),
    evFcf: round(base.fcf[1] > 0 ? softBand(interp(base.fcf, ebitdaPosition) * fcfMultiplier * capitalDrag * sizeAndCompanyFactor * softwareDurabilityGate, base.fcf[0], base.fcf[1]) : 0),
    softwareDurabilityGate: round(softwareDurabilityGate),
    marginQualityFactor: round(marginQualityFactor),
    rdInvestmentFactor: round(rdInvestmentFactor),
    sectorRdNorm: round(sectorRdNorm),
    rdCreditApplicable,
    positions: { growthPosition: round(growthPosition), qualityPosition: round(qualityPosition), revPosition: round(revPosition), ebitdaPosition: round(ebitdaPosition), marginPosition: round(marginPosition) },
  }
}

function pipelineRevenueCredit(input, context, ledger) {
  const expectedPipeline = input.pipelineValue * input.pipelineConversion
  if (expectedPipeline <= 0) return 0
  const remainingSam = Math.max(input.sam - input.revenue, 0)
  const conversionCredit = clamp(
    0.08 +
      ledger.signals.pipelineOpportunity.effective * 0.2 +
      ledger.signals.marketPotential.effective * 0.08 +
      (1 - context.size.sizeScore) * 0.16 +
      (input.capitalStatus === "Public" ? 0 : 0.08),
    0.06,
    0.45
  )
  return round(Math.min(expectedPipeline * conversionCredit, Math.max(remainingSam * 0.08, input.revenue * 1.2)), 2)
}

function dcfMarginCeiling(input, context, margins, ledger) {
  // Durability comes from the shared ledger composite (brand + structural moat +
  // competition) plus recurring mix, instead of re-reading the raw moat inputs here.
  const durability = clamp(
    ledger.signals.durability.effective * 0.82 + input.recurringRevenuePct * (context.modules.recurring ? 0.18 : 0.05),
    0,
    1
  )
  let ceiling = 0.24
  if (input.businessModel === "Software / Subscription") {
    ceiling = 0.26 + durability * 0.08 + input.recurringRevenuePct * 0.02
  } else if (input.businessModel === "Marketplace / Network Platform") {
    ceiling = 0.24 + durability * 0.17
  } else if (input.businessModel === "Hybrid") {
    ceiling = 0.21 + durability * 0.09 + context.modules.assetHeavy * 0.03
  } else if (["Manufacturing / Production", "Product / Hardware", "Tools / Devices / Equipment"].includes(input.businessModel)) {
    ceiling = 0.13 + durability * 0.06
  } else if (input.businessModel === "Retail / Commerce / Distribution") {
    ceiling = 0.045 + durability * 0.035 + input.subscriptionRevenuePct * 0.12
  } else if (input.businessModel === "Financial / Balance-Sheet Business") {
    ceiling = 0.28 + durability * 0.04
  } else if (input.businessModel === "IP / Licensing / Royalty") {
    ceiling = 0.28 + durability * 0.14
  } else {
    ceiling = 0.16 + durability * 0.08
  }
  const currentSupport = margins.fcfMargin > 0
    ? margins.fcfMargin + (input.businessModel === "Software / Subscription" ? 0.015 : 0.04)
    : ceiling
  return {
    ceiling: round(clamp(Math.max(ceiling, currentSupport), Math.max(margins.fcfMargin, -0.05), 0.5)),
    durability: round(durability),
  }
}

// Rebuilt DCF: a standard two-stage FCF model. Revenue growth fades from the
// credible near-term rate toward terminal growth; the FCF margin converges from
// the current margin to a durability-aware mature margin over the explicit
// horizon; the terminal value is a Gordon-growth perpetuity on the mature-margin
// FCF (not the last ramping year). This keeps the DCF stable and comparable
// across very different companies — the previous model collapsed to ~0 whenever
// the current margin was negative, which is what made it the highest-variance track.
function intrinsicTrack(input, context, margins, growth, probability, discount, ledger) {
  const sector = sectorBaseline(input)
  const N = clamp(Math.round(input.projectionYears), 3, 10)
  const r = Math.max(discount.rate, 0.03)
  const startRev = Math.max(input.revenue, Math.min(input.sam * 0.001, 250_000), 10_000)
  const tg = clamp(input.terminalGrowth * (0.8 + context.relevance.dcfReliability * 0.2), 0.01, Math.min(input.terminalGrowth, r - 0.02))

  // --- Margin path target ---
  const ceiling = dcfMarginCeiling(input, context, margins, ledger)
  const marginCap = Math.min(sector.gmCap - sector.capex, ceiling.ceiling)
  const startMargin = clamp(margins.fcfMargin, -0.6, marginCap)
  const marginBoostEligible = ["Revenue-Generating / Unprofitable", "Near Breakeven"].includes(input.profitabilityStatus)
  const declining = input.profitabilityStatus === "Declining / Margin Compression" || input.marginChangeYoy < -0.01
  let matureMargin = ceiling.ceiling
  if (declining) {
    // Compressing businesses earn no expansion; allow mild erosion from the current level.
    matureMargin = Math.min(startMargin, clamp(startMargin + Math.min(input.marginChangeYoy, 0) * 1.5, -0.15, startMargin))
  } else if (!marginBoostEligible && startMargin > 0) {
    // A profitable company is not handed an improvement it hasn't demonstrated: its
    // mature margin sits near current, only lightly lifted toward the sector ceiling.
    // The lift is gated by capital returns — a chronically capital-heavy, low-FCF
    // operator (e.g. an automaker) keeps its structurally low margin instead of being
    // assumed to converge to sector-normal free cash flow.
    const convergenceLift = clamp(0.12 + ledger.signals.capitalReturns.effective * 0.4, 0.12, 0.5)
    matureMargin = clamp(startMargin + (ceiling.ceiling - startMargin) * convergenceLift, startMargin - 0.02, ceiling.ceiling)
  }
  matureMargin = Math.min(matureMargin, marginCap)
  const marginGap = matureMargin - startMargin
  const convergence = 0.15 ** (1 / N) // ~85% of the gap closed by the terminal year

  // --- Explicit projection ---
  const g1 = clamp(growth.effectiveGrowth, -0.4, 3)
  const growthDecay = 0.8
  let revenue = startRev
  let dcf = 0
  const projections = []
  for (let year = 1; year <= N; year += 1) {
    const gYear = tg + (g1 - tg) * growthDecay ** (year - 1)
    const penetration = input.sam > 0 ? div(revenue, input.sam) : 0
    const dampedGrowth = gYear * Math.exp(-3 * penetration)
    const marketCeiling = input.sam > 0 ? Math.max(input.sam * 0.5, startRev) : Number.POSITIVE_INFINITY
    revenue = Math.min(revenue * (1 + dampedGrowth), marketCeiling)
    const marginYear = clamp(matureMargin - marginGap * convergence ** year, -0.6, marginCap)
    const fcf = revenue * marginYear * probability.intrinsicMultiplier
    const pv = fcf / (1 + r) ** year
    dcf += pv
    projections.push({ year, revenue: round(revenue, 2), fcfMargin: round(marginYear), fcf: round(fcf, 2), presentValue: round(pv, 2), growth: round(dampedGrowth) })
  }

  // --- Terminal value on the mature-margin FCF ---
  const terminalRevenue = projections.at(-1).revenue
  const terminalFcf = Math.max(terminalRevenue * (1 + tg) * matureMargin * probability.intrinsicMultiplier, 0)
  const terminalValue = terminalFcf / Math.max(r - tg, 0.02)
  const terminalCap = Math.max(terminalRevenue, 0) * Math.max(matureMargin, 0.02) * Math.min(1 / Math.max(r - tg, 0.02), 26)
  const boundedTerminal = Math.min(terminalValue, terminalCap)
  const pvTerminal = boundedTerminal / (1 + r) ** N

  // --- Small yearly net dilution / buyback effect on intrinsic per-share value ---
  const annualDilution = clamp(input.expectedDilution / Math.max(N, 3), 0, 0.02)
  const annualNetShare = clamp((input.capitalStatus === "Public" ? input.buybackYield : 0) - annualDilution, -0.03, 0.03)
  const shareEffect = clamp((1 + annualNetShare) ** N, 0.9, 1.12)

  const rawEV = Math.max((dcf + pvTerminal) * shareEffect, 0)
  return {
    rawEV: round(rawEV, 2),
    projections,
    terminalGrowth: round(tg),
    terminalValue: round(boundedTerminal, 2),
    terminalCapacityCap: round(terminalCap, 2),
    explicitPV: round(dcf, 2),
    pvTerminal: round(pvTerminal, 2),
    shareEffect: round(shareEffect),
    annualNetShare: round(annualNetShare),
    marginTrajectory: {
      startMargin: round(startMargin),
      matureMargin: round(matureMargin),
      marginGap: round(marginGap),
      marginBoostEligible,
      declining,
      convergence: round(convergence),
      appliedTrend: round(marginGap / N),
      marginCeiling: round(ceiling.ceiling),
      durability: ceiling.durability,
    },
  }
}

function industryBaselineTrack(input, context, margins, probability, multiples, ledger) {
  const family = context.multipleFamilyWeights
  const pipelineCredit = pipelineRevenueCredit(input, context, ledger)
  const revenueRef = input.revenue > 0 ? input.revenue + pipelineCredit : Math.min(input.sam * 0.00025, 500_000) + pipelineCredit
  const revenueValue = revenueRef * multiples.evRevenue
  const ebitdaValue = Math.max(input.revenue * margins.ebitdaMargin, 0) * multiples.evEbitda
  const fcfValue = Math.max(input.revenue * margins.fcfMargin, 0) * multiples.evFcf
  const blend = normalizeWeights({ revenue: family.revenue, ebitda: family.ebitda, fcf: family.fcf }, { revenue: 0.82, ebitda: 0.82, fcf: 0.82 })
  const comparableEV = (revenueValue * blend.revenue + ebitdaValue * blend.ebitda + fcfValue * blend.fcf) * probability.marketMultiplier * ledger.budgets.qualityBudget.market
  return {
    rawEV: round(comparableEV, 2),
    confidence: round(clamp(0.38 + ledger.signals.sizeEvidence.effective * 0.16 + ledger.signals.coreFinancialJustification.effective * 0.18 + ledger.signals.profitabilityQuality.effective * 0.08 - ledger.signals.marketMultiplePressure.effective * 0.08 - ledger.signals.probabilityUncertainty.effective * 0.08, 0.18, 0.84)),
    paths: {
      revenue: round(revenueValue, 2),
      ebitda: round(ebitdaValue, 2),
      fcf: round(fcfValue, 2),
      pipelineRevenueCredit: round(pipelineCredit, 2),
      comparableEV: round(comparableEV, 2),
    },
    blend,
    multiples,
  }
}

function directCompetitorTrack(input, context, margins, growth, probability, ledger) {
  const hasComps = input.competitorCount > 0 && (input.competitorEvRevenue > 0 || input.competitorEvEbitda > 0 || input.competitorEvFcf > 0)
  if (!hasComps) {
    return { active: false, rawEV: 0, confidence: 0, paths: { relativeAdjustment: 0, revenue: 0, ebitda: 0, fcf: 0 }, blend: {} }
  }
  const pipelineCredit = pipelineRevenueCredit(input, context, ledger)
  const revenueRef = Math.max(input.revenue + pipelineCredit * 0.55, input.revenue)
  const ebitda = Math.max(input.revenue * margins.ebitdaMargin, 0)
  const fcf = Math.max(input.revenue * margins.fcfMargin, 0)
  const growthDelta = clamp((growth.effectiveGrowth - input.competitorRevenueGrowth) / 0.7, -1, 1)
  const grossDelta = input.competitorGrossMargin ? clamp((margins.grossMargin - input.competitorGrossMargin) / 0.35, -1, 1) : 0
  const ebitdaDelta = input.competitorEbitdaMargin ? clamp((margins.ebitdaMargin - input.competitorEbitdaMargin) / 0.35, -1, 1) : 0
  const potentialDelta = ledger.signals.marketPotential.effective - 0.5
  const profitableOrFcfPositive = ["FCF Positive", "Profitable"].includes(input.profitabilityStatus) || margins.fcfMargin > 0
  const leveragePenalty = ledger.signals.leverageDeclineDrag.effective * (profitableOrFcfPositive ? 0.035 : 0.06) + ledger.signals.workingCapitalPressure.effective * (profitableOrFcfPositive ? 0.02 : 0.04)
  const grossWeight = margins.marginBlendActive && ledger.signals.lowDirectCompetition.effective > 0.65 ? 0.08 : 0.16
  const peerFinancialDelta = ledger.signals.coreFinancialJustification.effective * 2 - 1
  const relativeScore = clamp(
    peerFinancialDelta * 0.42 +
      growthDelta * 0.18 +
      grossDelta * grossWeight * 0.45 +
      ebitdaDelta * 0.08 +
      potentialDelta * 0.14 +
      ledger.signals.revenueQuality.effective * 0.04 +
      ledger.signals.lowDirectCompetition.effective * 0.1 -
      ledger.signals.marketMultiplePressure.effective * 0.08 -
      leveragePenalty,
    -1,
    1
  )
  const relativeAdjustment = decayedMultipleFactor(relativeScore, 0.58, 2.1, {
    upsideSensitivity: 1.08,
    downsideSensitivity: 1.75,
    upsidePower: 0.76,
    downsidePower: 1.1,
  })
  const values = {
    revenue: input.competitorEvRevenue > 0 ? revenueRef * input.competitorEvRevenue * relativeAdjustment : 0,
    ebitda: input.competitorEvEbitda > 0 && ebitda > 0 ? ebitda * input.competitorEvEbitda * relativeAdjustment : 0,
    fcf: input.competitorEvFcf > 0 && fcf > 0 ? fcf * input.competitorEvFcf * relativeAdjustment : 0,
  }
  const blend = normalizeWeights({
    revenue: input.competitorEvRevenue > 0 ? context.multipleFamilyWeights.revenue : 0,
    ebitda: input.competitorEvEbitda > 0 && ebitda > 0 ? context.multipleFamilyWeights.ebitda : 0,
    fcf: input.competitorEvFcf > 0 && fcf > 0 ? context.multipleFamilyWeights.fcf : 0,
  }, { revenue: 0.86, ebitda: 0.86, fcf: 0.86 })
  const rawEV = (values.revenue * (blend.revenue || 0) + values.ebitda * (blend.ebitda || 0) + values.fcf * (blend.fcf || 0)) * probability.marketMultiplier
  const confidence = clamp(0.22 + Math.min(input.competitorCount, 8) / 8 * 0.42 + (input.competitorRevenueGrowth !== 0 ? 0.08 : 0) + (input.competitorGrossMargin !== 0 ? 0.08 : 0) + (input.competitorEbitdaMargin !== 0 ? 0.08 : 0), 0.18, 0.88)
  return {
    active: true,
    rawEV: round(rawEV, 2),
    confidence: round(confidence),
    paths: {
      relativeScore: round(relativeScore),
      relativeAdjustment: round(relativeAdjustment),
      coreFinancialJustification: ledger.signals.coreFinancialJustification.effective,
      marketMultiplePressure: ledger.signals.marketMultiplePressure.effective,
      peerFinancialDelta: round(peerFinancialDelta),
      grossWeight: round(grossWeight),
      revenue: round(values.revenue, 2),
      ebitda: round(values.ebitda, 2),
      fcf: round(values.fcf, 2),
      pipelineRevenueCredit: round(pipelineCredit, 2),
    },
    blend,
  }
}

function publicMarketTrack(input, context, ledger) {
  const observedEquity = input.marketCapOverride > 0 ? input.marketCapOverride : input.sharePrice * input.sharesOutstanding
  const observedEV = input.capitalStatus === "Public" && observedEquity > 0 ? observedEquity + input.debt - input.cash : 0
  const publicEvidenceWeight = observedEV > 0
    ? clamp(context.relevance.publicAnchor * 0.56 + context.size.sizeScore * 0.16 + ledger.signals.coreFinancialJustification.effective * 0.12 + ledger.signals.profitabilityQuality.effective * 0.04 + ledger.signals.durability.effective * 0.03 + ledger.signals.brandDurability.effective * context.brand.relevance * 0.04 - ledger.signals.marketMultiplePressure.effective * 0.18 - ledger.signals.probabilityUncertainty.effective * 0.1, 0.08, 0.86)
    : 0
  return {
    active: observedEV > 0,
    rawEV: round(observedEV, 2),
    confidence: round(publicEvidenceWeight),
    paths: {
      ...ledger.budgets.financialComparison.observed,
      observedEquity: round(observedEquity, 2),
      observedEV: round(observedEV, 2),
      publicEvidenceWeight: round(publicEvidenceWeight),
      coreFinancialJustification: ledger.signals.coreFinancialJustification.effective,
      marketMultiplePressure: ledger.signals.marketMultiplePressure.effective,
    },
  }
}

function pipelineBacklogTrack(input, context, margins, probability, discount, ledger) {
  const expectedPipeline = input.pipelineValue * input.pipelineConversion
  const expectedBacklog = input.backlogValue * input.backlogConversion
  const totalExpected = expectedPipeline + expectedBacklog
  if (totalExpected <= 0) return { active: false, rawEV: 0, confidence: 0, paths: { expectedPipeline: 0, expectedBacklog: 0 } }
  const margin = clamp(
    weightedAverage([
      { value: Math.max(margins.grossMargin, 0), weight: expectedPipeline > 0 ? expectedPipeline : 0 },
      { value: Math.max(input.backlogGrossMargin, 0), weight: expectedBacklog > 0 ? expectedBacklog : 0 },
    ]),
    0.02,
    0.85
  )
  const duration = clamp(input.contractDurationYears * (0.55 + input.renewalProbability * 0.7), 0.35, 7)
  const executionRisk = clamp(0.35 + probability.commercial * 0.38 + probability.financing * 0.18 + ledger.signals.pipelineOpportunity.effective * 0.09, 0.18, 0.94)
  const pvFactor = (1 - (1 + discount.rate) ** -duration) / Math.max(discount.rate, 0.02)
  const rawEV = totalExpected * margin * pvFactor * executionRisk
  const confidence = clamp(0.2 + input.backlogConversion * 0.22 + input.pipelineConversion * 0.14 + ledger.signals.pipelineOpportunity.effective * 0.24 + (context.size.sizeScore < 0.5 ? 0.08 : 0), 0.12, 0.82)
  return {
    active: true,
    rawEV: round(rawEV, 2),
    confidence: round(confidence),
    paths: { expectedPipeline: round(expectedPipeline, 2), expectedBacklog: round(expectedBacklog, 2), margin: round(margin), duration: round(duration), executionRisk: round(executionRisk), pvFactor: round(pvFactor) },
  }
}

function membershipRelationshipMetrics(input, context, ledger) {
  const recurringMix = Math.max(input.subscriptionRevenuePct, context.modules.recurring ? input.recurringRevenuePct : 0)
  const recurringRevenue = input.revenue * recurringMix
  const annualRetention = clamp((1 - input.churn) ** 12, 0, 1)
  const retentionQuality = clamp((annualRetention - 0.45) / 0.53, 0, 1)
  const nrrQuality = clamp((input.nrr - 0.85) / 0.45, 0, 1)
  const scaleScore = logScore(recurringRevenue, 8.4, 1.05)
  // Relationship strength draws on the shared durability composite (brand + moat +
  // competition) plus membership-specific retention and scale, not raw moat inputs.
  const networkStrength = weightedAverage([
    { value: ledger.signals.durability.effective, weight: 0.48 },
    { value: nrrQuality, weight: 0.24 },
    { value: scaleScore, weight: 0.28 },
  ])
  const flywheel = clamp((scaleScore * (0.35 + networkStrength)) ** 1.25, 0, 1)
  const multiple = clamp(
    2.2 +
      retentionQuality ** 1.35 * 5.8 +
      nrrQuality * 1.1 +
      ledger.signals.durability.effective * 3 +
      flywheel * 5.2,
    1.2,
    18
  )
  return {
    recurringMix: round(recurringMix),
    recurringRevenue: round(recurringRevenue, 2),
    annualRetention: round(annualRetention),
    retentionQuality: round(retentionQuality),
    nrrQuality: round(nrrQuality),
    scaleScore: round(scaleScore),
    networkStrength: round(networkStrength),
    flywheel: round(flywheel),
    multiple: round(multiple),
  }
}

function assetSplitValuation(input, context, ledger, membershipMetrics) {
  const rows = []
  for (let index = 1; index <= 6; index += 1) {
    const type = input[`asset${index}Type`]
    const value = input[`asset${index}Value`]
    if (!type || type === "None" || value <= 0) continue
    const baseRule = ASSET_TYPE_RULES[type] || ASSET_TYPE_RULES["Other Tangible Assets"]
    const rule = { ...baseRule }
    if (type === "Customer Contracts / Membership Base") {
      rule.multiplier = clamp(0.35 + membershipMetrics.multiple / 10, 0.45, 1.9)
      rule.liquidity = clamp(0.12 + membershipMetrics.annualRetention * 0.28, 0.14, 0.44)
      rule.productive = clamp(0.45 + membershipMetrics.retentionQuality * 0.28 + membershipMetrics.flywheel * 0.2, 0.45, 0.94)
      rule.appreciates = clamp(0.1 + membershipMetrics.flywheel * 0.48, 0.1, 0.6)
    }
    if (type === "Owned Cloud Compute / Data Center Capacity" || type === "Data Centers / Servers") {
      rule.multiplier = clamp(rule.multiplier + ledger.signals.moatStrength.effective * 0.12, 0.55, 0.98)
    }
    if (type === "Brand / Trademarks") {
      // A brand line item is only credited as a separable asset to the extent the
      // audited brand-durability signal supports it. Consumer brands with real
      // reach can carry a premium; institutional or weak brands are marked down.
      const separable = context.brand.isConsumer
        ? clamp(0.3 + context.brand.reachScore * 0.45 + ledger.signals.brandDurability.effective * 0.5, 0.3, 1.3)
        : clamp(0.2 + ledger.signals.brandDurability.effective * 0.35, 0.2, 0.75)
      rule.multiplier = separable
      rule.productive = clamp(0.4 + ledger.signals.brandDurability.effective * 0.4, 0.4, 0.9)
      rule.appreciates = clamp(0.1 + ledger.signals.brandDurability.effective * 0.4, 0.1, 0.65)
    }
    rows.push({
      slot: index,
      type,
      value: round(value, 2),
      multiplier: round(rule.multiplier),
      adjustedValue: round(value * rule.multiplier, 2),
      liquidationValue: round(value * rule.liquidity, 2),
      hardAssetScore: round(rule.hardAsset),
      appreciationScore: round(rule.appreciates),
      productiveScore: round(rule.productive),
    })
  }
  const totalInputValue = rows.reduce((sum, row) => sum + row.value, 0)
  const adjustedValue = rows.reduce((sum, row) => sum + row.adjustedValue, 0)
  const liquidationValue = rows.reduce((sum, row) => sum + row.liquidationValue, 0)
  const hardAssetScore = weightedAverage(rows.map((row) => ({ value: row.hardAssetScore, weight: row.value })))
  const appreciationScore = weightedAverage(rows.map((row) => ({ value: row.appreciationScore, weight: row.value })))
  const productiveScore = weightedAverage(rows.map((row) => ({ value: row.productiveScore, weight: row.value })))
  const customerContractAdjustedValue = rows
    .filter((row) => row.type === "Customer Contracts / Membership Base")
    .reduce((sum, row) => sum + row.adjustedValue, 0)
  return {
    active: rows.length > 0,
    rows,
    totalInputValue: round(totalInputValue, 2),
    adjustedValue: round(adjustedValue, 2),
    liquidationValue: round(liquidationValue, 2),
    hardAssetScore: round(hardAssetScore),
    appreciationScore: round(appreciationScore),
    productiveScore: round(productiveScore),
    customerContractAdjustedValue: round(customerContractAdjustedValue, 2),
  }
}

function assetBalanceSheetTrack(input, context, margins, ledger, growth) {
  const membershipMetrics = membershipRelationshipMetrics(input, context, ledger)
  const assetSplit = assetSplitValuation(input, context, ledger, membershipMetrics)
  const workingAssets = Math.max(input.cash + input.inventory + input.ar - input.ap - input.debt, 0)
  const multiLocationCredit = input.tags.includes("Multi-Location / Local Footprint") ? 0.02 : 0
  const footprintRate = context.modules.assetHeavy
    ? clamp(0.025 + input.capexPct * 1.35 + ledger.signals.lowDirectCompetition.effective * 0.025 + multiLocationCredit, 0.025, 0.14)
    : clamp(0.01 + input.capexPct * 0.65, 0.01, 0.055)
  const productiveFootprintValue = input.revenue * footprintRate
  const subscriptionGrossProfit = input.revenue * input.subscriptionRevenuePct * Math.max(input.subscriptionGrossMargin, 0)
  const subscriptionRelationshipAsset = subscriptionGrossProfit > 0
    ? Math.max(subscriptionGrossProfit * membershipMetrics.multiple - assetSplit.customerContractAdjustedValue, 0)
    : 0
  const calculatedAssetBacking = Math.max(
    input.tangibleBookValue,
    input.assetBackingValue,
    workingAssets + productiveFootprintValue,
    assetSplit.adjustedValue
  ) + subscriptionRelationshipAsset
  const book = calculatedAssetBacking
  if (book <= 0) return { active: false, rawEV: 0, confidence: 0, paths: { book: 0 } }
  const netDebt = Math.max(input.debt - input.cash, 0)
  if (context.modules.infrastructure) {
    // Regulated / contracted asset-base valuation. The equity base is the equity
    // portion of the rate/asset base (gross asset candidates are netted of debt so
    // debt-funded assets are not counted as equity). The typed-asset split — real
    // estate at its appreciation multiple, vehicles at a discount, etc. — feeds this
    // base through the same max() used above, so it is a candidate for the base, never
    // added on top of it. A regulated-return premium is then applied to the equity base.
    const grossAssetBase = Math.max(input.assetBackingValue, assetSplit.adjustedValue, workingAssets + productiveFootprintValue + netDebt)
    const equityAssetBase = Math.max(input.tangibleBookValue, grossAssetBase - netDebt, 0)
    const returnQuality = clamp((Math.max(input.roe || input.rotce, 0.02) - 0.02) / 0.12, 0, 1)
    const rateBaseGrowth = clamp(input.capexPct * 1.4 + Math.max((growth?.effectiveGrowth ?? input.revenueGrowth), 0) * 0.6, 0, 1)
    const regulatoryStability = weightedAverage([
      { value: ledger.signals.durability.effective, weight: 0.32 },
      { value: input.recurringRevenuePct, weight: 0.24 },
      { value: context.modules.regulated ? 0.85 : 0.45, weight: 0.2 },
      // A rate-base compact is only worth what the governing regime will honor: a
      // regulated utility in a weak-rule-of-law state cannot count on its returns.
      { value: context.jurisdiction.solidity, weight: 0.24 },
    ])
    const regulatedPremium = clamp(
      (1 + returnQuality * 0.55 + rateBaseGrowth * 0.7 + regulatoryStability * 0.55) * (0.7 + context.jurisdiction.solidity * 0.3),
      0.7,
      2.9
    )
    const equityValue = equityAssetBase * regulatedPremium
    return {
      active: true,
      rawEV: round(equityValue + netDebt, 2),
      confidence: round(clamp(0.4 + context.relevance.publicAnchor * 0.2 + regulatoryStability * 0.14 + (input.roe || input.rotce ? 0.12 : 0), 0.32, 0.86)),
      paths: {
        book: round(book, 2),
        regime: "regulated-asset-base",
        equityAssetBase: round(equityAssetBase, 2),
        regulatedPremium: round(regulatedPremium),
        returnQuality: round(returnQuality),
        rateBaseGrowth: round(rateBaseGrowth),
        regulatoryStability: round(regulatoryStability),
        netDebt: round(netDebt, 2),
        workingAssets: round(workingAssets, 2),
        productiveFootprintValue: round(productiveFootprintValue, 2),
        disclosedAssetBacking: round(input.assetBackingValue, 2),
        tangibleBookValue: round(input.tangibleBookValue, 2),
        membershipMetrics,
        calculatedAssetBacking: round(calculatedAssetBacking, 2),
        assetSplit,
      },
    }
  }
  if (context.modules.financial) {
    // Banks are valued on TANGIBLE book and a justified price-to-tangible-book, driven
    // by return on tangible common equity vs cost of equity (a Gordon-style P/B):
    // P/TBV ~= (ROTCE - g) / (Ke - g). Using stated (goodwill-inflated) book or a
    // generic quality curve over-credited banks; anchoring to ROTCE fixes that.
    const bankBook = input.tangibleBookValue > 0 ? input.tangibleBookValue : book
    const returnOnEquity = Math.max(input.rotce || input.roe, 0)
    const growthTerm = clamp(Math.max(growth?.effectiveGrowth ?? input.revenueGrowth, 0) * 0.3, 0, 0.02)
    const costOfEquity = clamp(0.1 + ledger.signals.leverageDeclineDrag.effective * 0.02 + ledger.signals.probabilityUncertainty.effective * 0.015 - context.relevance.publicAnchor * 0.005, 0.095, 0.13)
    const justifiedPB = clamp((returnOnEquity - growthTerm) / Math.max(costOfEquity - growthTerm, 0.04), 0, 3)
    const quality = weightedAverage([
      { value: ledger.signals.marketAnchorReliability.effective, weight: 0.45 },
      { value: ledger.signals.profitabilityQuality.effective, weight: 0.3 },
      { value: 1 - ledger.signals.leverageDeclineDrag.effective, weight: 0.25 },
    ])
    const priceToBook = clamp(0.3 + justifiedPB * 0.85 + quality * 0.18, 0.5, 2.8)
    return {
      active: true,
      rawEV: round(bankBook * priceToBook + netDebt, 2),
      confidence: round(clamp(0.44 + context.relevance.publicAnchor * 0.2 + (input.rotce || input.roe ? 0.2 : 0), 0.32, 0.9)),
      paths: {
        book: round(bankBook, 2),
        regime: "bank-tangible-book",
        priceToBook: round(priceToBook),
        justifiedPB: round(justifiedPB),
        returnOnEquity: round(returnOnEquity),
        costOfEquity: round(costOfEquity),
        workingAssets: round(workingAssets, 2),
        disclosedAssetBacking: round(input.assetBackingValue, 2),
        tangibleBookValue: round(input.tangibleBookValue, 2),
        productiveFootprintValue: round(productiveFootprintValue, 2),
        subscriptionRelationshipAsset: round(subscriptionRelationshipAsset, 2),
        membershipMetrics,
        calculatedAssetBacking: round(calculatedAssetBacking, 2),
        assetSplit,
      },
    }
  }
  const splitQuality = assetSplit.active
    ? assetSplit.hardAssetScore * 0.36 + assetSplit.appreciationScore * 0.34 + assetSplit.productiveScore * 0.3
    : 0
  const backingMultiple = clamp(
    0.72 +
      ledger.signals.profitabilityQuality.effective * 0.28 +
      ledger.signals.marketPotential.effective * 0.16 +
      ledger.signals.lowDirectCompetition.effective * 0.14 +
      splitQuality * 0.14 -
      ledger.signals.capitalBurden.effective * 0.15,
    0.45,
    assetSplit.active ? 1.42 : 1.55
  )
  return {
    active: true,
    rawEV: round(book * backingMultiple + Math.max(input.debt - input.cash, 0), 2),
    confidence: round(clamp(0.18 + context.multipleFamilyWeights.asset * 0.5 + context.relevance.maturity * 0.18 + ledger.signals.lowDirectCompetition.effective * 0.08 + (assetSplit.active ? 0.12 : 0), 0.12, 0.82)),
    paths: {
      book: round(book, 2),
      backingMultiple: round(backingMultiple),
      splitQuality: round(splitQuality),
      workingAssets: round(workingAssets, 2),
      disclosedAssetBacking: round(input.assetBackingValue, 2),
      tangibleBookValue: round(input.tangibleBookValue, 2),
      productiveFootprintValue: round(productiveFootprintValue, 2),
      subscriptionRelationshipAsset: round(subscriptionRelationshipAsset, 2),
      membershipMetrics,
      calculatedAssetBacking: round(calculatedAssetBacking, 2),
      assetSplit,
    },
  }
}

function strategicTrack(input, context, margins, growth, probability, discount, multiples, ledger) {
  let revenue = Math.max(input.revenue + pipelineRevenueCredit(input, context, ledger) * 0.45, Math.min(input.sam * 0.001, 250_000), 10_000)
  const exitYears = clamp(input.projectionYears, 3, 8)
  for (let year = 1; year <= exitYears; year += 1) {
    const marketCeiling = input.sam > 0 ? input.sam * 0.45 : Number.POSITIVE_INFINITY
    revenue = Math.min(revenue * (1 + Math.max(growth.effectiveGrowth, -0.5) * 0.8 ** (year - 1)), marketCeiling)
  }
  const strategicBudget = ledger.signals.strategicScarcity.effective
  const premium = clamp(0.025 + strategicBudget * 0.12 + clamp(input.acquirerPool / 20, 0, 1) * 0.035 + (input.strategicPremiumFlag ? 0.015 : 0), 0, 0.16)
  const exitEbitda = Math.max(revenue * Math.max(margins.ebitdaMargin, 0), 0)
  const exitValue = weightedAverage([
    { value: revenue * multiples.evRevenue, weight: context.multipleFamilyWeights.revenue },
    { value: multiples.evEbitda > 0 ? exitEbitda * multiples.evEbitda : 0, weight: context.multipleFamilyWeights.ebitda },
  ])
  const rawEV = exitValue * (1 + premium) * probability.strategicMultiplier * ledger.budgets.qualityBudget.strategic * ledger.budgets.scaleStackingPenalty * ledger.budgets.sizeStrategicCapMultiplier / (1 + discount.rate) ** exitYears
  return { rawEV: round(rawEV, 2), exitRevenue: round(revenue, 2), strategicPremium: round(premium), strategicBudget: round(strategicBudget) }
}

function riskDiscount(input, margins, ledger) {
  const profitableOrFcfPositive = ["FCF Positive", "Profitable"].includes(input.profitabilityStatus) || margins.fcfMargin > 0
  const baseRisk = clamp(
    1 -
      ledger.signals.probabilityUncertainty.effective * (profitableOrFcfPositive ? 0.08 : 0.17) -
      ledger.signals.capitalBurden.effective * (profitableOrFcfPositive ? 0.055 : 0.13) -
      Math.max(-margins.fcfMargin, 0) * (profitableOrFcfPositive ? 0.035 : 0.12) +
      ledger.signals.marketPotential.effective * (profitableOrFcfPositive ? 0.025 : 0.012),
    0.2,
    1
  )
  const floor = input.lifecycleStage === "Distressed"
    ? 0.16
    : input.profitabilityStatus === "Pre-Revenue"
      ? 0.2
      : input.capitalStatus === "Public"
        ? (profitableOrFcfPositive ? 0.78 : 0.58)
        : (profitableOrFcfPositive ? 0.56 : 0.3)
  return {
    intrinsic: round(clamp(baseRisk, floor, 1)),
    market: round(clamp(1 - (1 - baseRisk) * (profitableOrFcfPositive ? 0.48 : 0.7), Math.min(floor + 0.08, 0.92), 1)),
    strategic: round(clamp(1 - (1 - baseRisk) * (profitableOrFcfPositive ? 0.58 : 0.8), Math.min(floor + 0.06, 0.9), 1)),
  }
}

function trackWeightProfile(input, context, growth, ledger) {
  const maturePublic = input.capitalStatus === "Public" && ["FCF Positive", "Profitable"].includes(input.profitabilityStatus) && context.relevance.maturity >= 0.68
  const earlyPotential = context.size.sizeScore < 0.5 || ["Concept / Pre-Product", "Prototype / Pre-Revenue", "Early Commercial", "Scaling"].includes(input.lifecycleStage)
  if (context.modules.financial) {
    // Banks and balance-sheet businesses are valued on book / ROE (P/B) and P/E,
    // not on EV/revenue. Revenue-multiple comps (directComps / industry) are
    // structurally wrong here, so they carry little weight; book and the observed
    // market anchor carry the valuation.
    return { dcf: 0.05, directComps: 0.05, industry: 0.02, publicMarket: 0.34, pipeline: 0.01, asset: 0.51, strategic: 0.02 }
  }
  if (context.modules.infrastructure) {
    // Rate/asset base and the market anchor carry the valuation. The FCF DCF is
    // heavily down-weighted (these operators run negative FCF by design), and the
    // EV/EBITDA comps are only lightly trusted because utility EBITDA is sensitive
    // to depreciation assumptions on a very large asset base.
    return { dcf: 0.08, directComps: 0.1, industry: 0.05, publicMarket: 0.27, pipeline: 0.02, asset: 0.46, strategic: 0.02 }
  }
  if (input.businessModel === "Biopharma / R&D Asset" || input.profitabilityStatus === "Pre-Revenue") {
    return { dcf: 0.07, directComps: 0.2, industry: 0.08, publicMarket: input.capitalStatus === "Public" ? 0.14 : 0.02, pipeline: 0.24, asset: 0.1, strategic: 0.25 }
  }
  if (maturePublic) {
    const pipelineNeed = ledger.signals.pipelineOpportunity.effective > 0.15 ? 0.08 : 0.02
    const strategicNeed = ledger.signals.marketPotential.effective > 0.65 ? 0.08 : 0.04
    const assetNeed = context.modules.assetHeavy ? 0.1 : 0.03
    const publicNeed = ledger.signals.marketMultiplePressure.effective > 0.25 ? 0.22 : ledger.signals.lowDirectCompetition.effective > 0.72 ? 0.3 : 0.27
    return { dcf: 0.22, directComps: 0.34, industry: 0.1, publicMarket: publicNeed, pipeline: pipelineNeed, asset: assetNeed, strategic: strategicNeed }
  }
  if (earlyPotential) {
    return { dcf: 0.1, directComps: 0.28, industry: 0.14, publicMarket: input.capitalStatus === "Public" ? 0.14 : 0.03, pipeline: 0.2, asset: 0.05, strategic: 0.17 }
  }
  return { dcf: 0.18, directComps: 0.3, industry: 0.16, publicMarket: input.capitalStatus === "Public" ? 0.2 : 0.05, pipeline: 0.07, asset: 0.05, strategic: 0.07 }
}

function aggregate(input, context, growth, ledger, tracks) {
  const stability = weightedAverage([
    { value: context.relevance.maturity, weight: 0.24 },
    { value: context.relevance.dcfReliability, weight: 0.24 },
    { value: ledger.signals.marketAnchorReliability.effective, weight: 0.22 },
    { value: ledger.signals.profitabilityQuality.effective, weight: 0.16 },
    { value: 1 - ledger.signals.workingCapitalPressure.effective, weight: 0.04 },
    { value: ledger.signals.sizeEvidence.effective, weight: 0.1 },
  ])
  const decline = growth.effectiveGrowth < 0 ? 1 : 0
  const emergingPotential = ledger.signals.marketPotential.effective * clamp(1 - context.size.sizeScore * 0.65, 0.35, 1)
  const matureOperating = context.relevance.maturity >= 0.68 &&
    ["FCF Positive", "Profitable"].includes(input.profitabilityStatus) &&
    !context.modules.rAndD &&
    input.ipScore < 8 &&
    input.networkEffectScore < 8
  const strategicCap = decline
    ? Math.min(ledger.budgets.strategicCap, 0.025)
    : matureOperating && ledger.signals.marketPotential.effective < 0.65
      ? Math.min(ledger.budgets.strategicCap, 0.075)
      : ledger.budgets.strategicCap
  const profile = trackWeightProfile(input, context, growth, ledger)
  const desired = Object.fromEntries(Object.entries(profile).map(([key, value]) => {
    const track = tracks[key]
    const active = track && track.rawEV > 0 && track.confidence > 0
    const marketCoreTilt = ["directComps", "industry", "publicMarket"].includes(key)
      ? clamp(1.06 + ledger.signals.coreFinancialJustification.effective * 0.18 - ledger.signals.marketMultiplePressure.effective * (key === "publicMarket" ? 0.22 : 0.08), 0.82, 1.22)
      : 1
    return [key, active ? value * clamp(0.45 + track.confidence * 0.85, 0.2, 1.2) * marketCoreTilt : 0]
  }))
  const caps = {
    dcf: context.relevance.dcfReliability > 0.65 ? 0.42 : 0.3,
    directComps: tracks.directComps?.active ? 0.5 : 0,
    industry: 0.34,
    publicMarket: tracks.publicMarket?.active ? 0.38 : 0,
    pipeline: ledger.signals.pipelineOpportunity.effective > 0.2 ? 0.34 : 0.12,
    asset: context.modules.financial || context.modules.infrastructure ? 0.52 : 0.22,
    strategic: strategicCap,
  }
  const trackWeights = normalizeWeights(desired, caps)
  const fairEV = Object.entries(trackWeights).reduce((sum, [key, weight]) => sum + (tracks[key]?.rawEV || 0) * weight, 0)
  const weights = {
    dcf: trackWeights.dcf || 0,
    market: round((trackWeights.directComps || 0) + (trackWeights.industry || 0) + (trackWeights.publicMarket || 0)),
    pipeline: trackWeights.pipeline || 0,
    asset: trackWeights.asset || 0,
    strategic: trackWeights.strategic || 0,
  }
  return {
    weights,
    trackWeights,
    fairEV: round(fairEV, 2),
    drivers: { stability: round(stability), strategicCap: round(strategicCap), decline, sizeScore: context.size.sizeScore, marketShare: context.size.marketShare, emergingPotential: round(emergingPotential), profile },
  }
}

function band(center, uncertaintyDown, uncertaintyUp) {
  return {
    center: round(center, 2),
    low: round(center * (1 - uncertaintyDown), 2),
    high: round(center * (1 + uncertaintyUp), 2),
    uncertaintyDown: round(uncertaintyDown),
    uncertaintyUp: round(uncertaintyUp),
  }
}

function confidenceBands(input, context, margins, growth, probability, ledger, outputs) {
  const completeness = [
    input.tam > 0,
    input.sam > 0,
    input.revenue >= 0,
    input.grossMargin !== null,
    input.opexRatio !== null,
    input.projectionYears >= 3,
    input.terminalGrowth > 0,
    input.cash >= 0,
    input.debt >= 0,
  ].filter(Boolean).length / 9
  const quality = weightedAverage([
    { value: completeness, weight: 0.22 },
    { value: ledger.signals.revenueQuality.effective, weight: 0.18 },
    { value: ledger.signals.profitabilityQuality.effective, weight: 0.15 },
    { value: ledger.signals.marginConversion.effective, weight: 0.07 },
    { value: 1 - ledger.signals.workingCapitalPressure.effective, weight: 0.07 },
    { value: 1 - ledger.signals.probabilityUncertainty.effective, weight: 0.15 },
    { value: 1 - growth.growthGap, weight: 0.11 },
    { value: ledger.signals.marketPotential.effective, weight: 0.05 },
    { value: context.relevance.dcfReliability, weight: 0.08 },
    { value: ledger.signals.sizeEvidence.effective, weight: 0.02 },
  ])
  const dispersion = (() => {
    const values = [outputs.intrinsicEV, outputs.marketEV, outputs.strategicEV].filter((value) => value > 0)
    const avg = values.reduce((sum, value) => sum + value, 0) / Math.max(values.length, 1)
    const variance = values.reduce((sum, value) => sum + (value - avg) ** 2, 0) / Math.max(values.length, 1)
    return clamp(1 - div(Math.sqrt(variance), Math.max(avg, 1)), 0, 1)
  })()
  const bandQuality = clamp(quality * 0.72 + dispersion * 0.28, 0, 1)
  return {
    quality: round(bandQuality),
    intrinsic: band(outputs.intrinsicEV, clamp(0.52 - bandQuality * 0.22, 0.18, 0.52), clamp(0.34 - bandQuality * 0.14, 0.14, 0.34)),
    market: band(outputs.marketEV, clamp(0.42 - bandQuality * 0.18, 0.16, 0.42), clamp(0.28 - bandQuality * 0.1, 0.12, 0.28)),
    strategic: band(outputs.strategicEV, clamp(0.58 - bandQuality * 0.24, 0.22, 0.58), clamp(0.42 - bandQuality * 0.16, 0.16, 0.42)),
    drivers: { completeness: round(completeness), quality: round(quality), dispersion: round(dispersion), growthGap: growth.growthGap },
  }
}

function equityBridge(ev, input, margins, ledger) {
  const equity = ev - (input.debt - input.cash)
  const buybackUplift = input.capitalStatus === "Public" && input.buybackYield > 0 && margins.fcfMargin > 0
    ? Math.min(input.buybackYield * 3, 0.18)
    : 0
  const dividendDurabilityUplift = input.capitalStatus === "Public" && input.dividendYield > 0 && margins.fcfMargin > 0
    ? Math.min(input.dividendYield * (1.05 + ledger.signals.dividendDurability.effective * 0.75), 0.1)
    : 0
  const adjusted = equity > 0 ? equity * (1 + buybackUplift + dividendDurabilityUplift) : 0
  return {
    enterpriseValue: round(ev, 2),
    equityValue: round(adjusted, 2),
    commonEquity: round(adjusted * (1 - input.expectedDilution), 2),
    buybackUplift: round(buybackUplift),
    dividendDurabilityUplift: round(dividendDurabilityUplift),
  }
}

function validate(input, context) {
  const errors = []
  const warnings = []
  if (input.sam > input.tam) errors.push("SAM cannot exceed TAM.")
  if (input.revenue > input.sam * 0.4 && input.sam > 0) warnings.push("Revenue is already above 40% of SAM; review market sizing.")
  if (context.modules.inventoryRelevant && input.inventory === 0 && input.revenue > 1_000_000) warnings.push("Inventory appears relevant for this classification; confirm zero inventory.")
  if (context.modules.recurring && input.revenue > 1_000_000 && input.nrr === 1) warnings.push("Recurring business with default NRR; review retention if available.")
  if (input.terminalGrowth > 0.055 && input.lifecycleStage !== "Profitable / Mature") warnings.push("Terminal growth is high for a non-mature company.")
  if (input.profitabilityStatus === "Declining / Margin Compression" && input.revenueGrowth > 0) warnings.push("Profitability says declining while revenue growth is positive; review classification.")
  return { errors, warnings }
}

function computeValuation(rawInput = {}) {
  const input = normalizeInputs(rawInput)
  const context = deriveContext(input)
  const margins = computeMargins(input)
  const growth = computeGrowthCredibility(input, context, margins)
  const ledger = buildSignalLedger(input, context, margins, growth)
  const probability = probabilityLayers(input, context, margins, ledger)
  const discount = discountRate(input, context, margins, ledger, growth)
  const multiples = dynamicMultiples(input, context, margins, growth, ledger)
  const intrinsic = intrinsicTrack(input, context, margins, growth, probability, discount, ledger)
  const industry = industryBaselineTrack(input, context, margins, probability, multiples, ledger)
  const directComps = directCompetitorTrack(input, context, margins, growth, probability, ledger)
  const publicMarket = publicMarketTrack(input, context, ledger)
  const pipeline = pipelineBacklogTrack(input, context, margins, probability, discount, ledger)
  const asset = assetBalanceSheetTrack(input, context, margins, ledger, growth)
  const strategic = strategicTrack(input, context, margins, growth, probability, discount, multiples, ledger)
  const risk = riskDiscount(input, margins, ledger)
  const trackOutputs = {
    dcf: { ...intrinsic, rawEV: round(intrinsic.rawEV * risk.intrinsic * ledger.budgets.qualityBudget.intrinsic, 2), confidence: round(context.relevance.dcfReliability) },
    directComps: { ...directComps, rawEV: round(directComps.rawEV * risk.market, 2) },
    industry: { ...industry, rawEV: round(industry.rawEV * risk.market, 2) },
    publicMarket,
    pipeline: { ...pipeline, rawEV: round(pipeline.rawEV * risk.strategic, 2) },
    asset: { ...asset, rawEV: round(asset.rawEV * (context.modules.financial ? 1 : risk.market), 2) },
    strategic: { ...strategic, rawEV: round(strategic.rawEV * risk.strategic, 2), confidence: round(clamp(0.18 + ledger.signals.strategicScarcity.effective * 0.36 + ledger.signals.marketPotential.effective * 0.18 - ledger.signals.probabilityUncertainty.effective * 0.12, 0.08, 0.72)) },
  }
  const outputs = {
    intrinsicEV: trackOutputs.dcf.rawEV,
    marketEV: round(weightedAverage([
      { value: trackOutputs.industry.rawEV, weight: trackOutputs.industry.confidence },
      { value: trackOutputs.directComps.rawEV, weight: trackOutputs.directComps.confidence },
      { value: trackOutputs.publicMarket.rawEV, weight: trackOutputs.publicMarket.confidence },
    ]), 2),
    strategicEV: trackOutputs.strategic.rawEV,
    pipelineEV: trackOutputs.pipeline.rawEV,
    assetEV: trackOutputs.asset.rawEV,
    directCompsEV: trackOutputs.directComps.rawEV,
    industryEV: trackOutputs.industry.rawEV,
    publicMarketEV: trackOutputs.publicMarket.rawEV,
  }
  const bands = confidenceBands(input, context, margins, growth, probability, ledger, outputs)
  const final = aggregate(input, context, growth, ledger, trackOutputs)
  const fairBridge = equityBridge(final.fairEV, input, margins, ledger)
  // Fair-value range width is a direct function of confidence: a high-confidence
  // valuation gets a tight band (~+/-10%), a low-confidence one stays wide (~+/-35%).
  bands.final = band(
    fairBridge.commonEquity,
    clamp(0.42 - bands.quality * 0.34, 0.08, 0.42),
    clamp(0.34 - bands.quality * 0.27, 0.07, 0.34)
  )
  const validation = validate(input, context)
  const observedMarketCap = publicMarket.paths.observedEquity
  const marketComparison = observedMarketCap > 0
    ? {
      observedMarketCap,
      premiumDiscount: round(div(fairBridge.commonEquity - observedMarketCap, observedMarketCap)),
      inFairValueRange: observedMarketCap >= bands.final.low && observedMarketCap <= bands.final.high,
      publicEvidenceWeight: publicMarket.paths.publicEvidenceWeight,
    }
    : null
  const warnings = [
    ...validation.warnings,
    ...ledger.warnings,
    marketComparison && !marketComparison.inFairValueRange ? "Observed market cap is outside the fair-value range; review public-market calibration before treating the point estimate as accurate." : null,
  ].filter(Boolean)
  return {
    input,
    context,
    margins,
    growth,
    ledger,
    probability,
    discount,
    multiples,
    tracks: {
      intrinsic,
      market: {
        rawEV: outputs.marketEV,
        paths: {
          ...industry.paths,
          observedEquity: publicMarket.paths.observedEquity,
          observedEV: publicMarket.paths.observedEV,
          publicEvidenceWeight: publicMarket.paths.publicEvidenceWeight,
          financialComparison: ledger.budgets.financialComparison,
          directCompsEV: trackOutputs.directComps.rawEV,
          industryEV: trackOutputs.industry.rawEV,
          publicMarketEV: trackOutputs.publicMarket.rawEV,
        },
      },
      strategic,
      dcf: trackOutputs.dcf,
      industry: trackOutputs.industry,
      directComps: trackOutputs.directComps,
      publicMarket: trackOutputs.publicMarket,
      pipeline: trackOutputs.pipeline,
      asset: trackOutputs.asset,
    },
    risk,
    outputs: {
      ...outputs,
      fairEV: final.fairEV,
      fairEquity: fairBridge.equityValue,
      fairCommonEquity: fairBridge.commonEquity,
      equityBridge: fairBridge,
    },
    final,
    bands,
    marketComparison,
    warnings,
    errors: validation.errors,
  }
}

const DRAFT_KEY = "eval-system-2-draft"
const DRAFT_META_KEY = "eval-system-2-ingestion"

function loadDraft() {
  try {
    const saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null")
    return saved ? normalizeInputs({ ...DEFAULT_INPUTS, ...saved }) : structuredClone(FIXTURES["Costco 2025 Public"])
  } catch {
    return structuredClone(FIXTURES["Costco 2025 Public"])
  }
}

function saveDraft() {

function cleanIngestionBase(current) {
  const clean = { ...DEFAULT_INPUTS, tags: [] }
  for (const field of fields) {
    if (QUALITATIVE_GROUPS.has(field.group)) {
      clean[field.key] = current[field.key]
      continue
    }
    if (field.key === "terminalGrowth" || field.key === "projectionYears") continue
    if (field.type === "select") clean[field.key] = field.key.startsWith("asset") ? "None" : DEFAULT_INPUTS[field.key]
    else if (field.type === "text") clean[field.key] = ""
    else if (field.type === "checkbox") clean[field.key] = false
    else clean[field.key] = 0
  }
  return clean
}

const fieldMap = Object.fromEntries(fields.map((field) => [field.key, field]))

function fieldLabel(key) {
  return fieldMap[key]?.label || key
}

function valueMissing(key, value, input) {
  if (key === "companyName") return !String(value || "").trim() || value === DEFAULT_INPUTS.companyName
  if (key === "marketCapOverride") return input.capitalStatus === "Public" && !(input.marketCapOverride > 0 || (input.sharePrice > 0 && input.sharesOutstanding > 0))
  if (["sharePrice", "sharesOutstanding"].includes(key)) return input.capitalStatus === "Public" && !(input.marketCapOverride > 0 || (input.sharePrice > 0 && input.sharesOutstanding > 0))
  if (key === "eps") return input.capitalStatus === "Public" && !(value > 0)
  if (key === "competitorPe") return input.capitalStatus === "Public" && !(value > 0) && ["FCF Positive", "Profitable"].includes(input.profitabilityStatus)
  if (key === "competitorEvEbitda") return !(value > 0) && ["FCF Positive", "Profitable"].includes(input.profitabilityStatus)
  if (key === "competitorEvFcf") return !(value > 0) && input.profitabilityStatus === "FCF Positive"
  if (typeof value === "string") return value.trim() === ""
  if (Array.isArray(value)) return value.length === 0
  return !(Number(value) !== 0)
}

function automationReview(input) {
  const normalized = normalizeInputs(input)
  const missing = automationCoreFields
    .filter((key) => valueMissing(key, normalized[key], normalized))
    .map((key) => fieldLabel(key))
  const subjective = automationJudgmentFields.map((key) => ({
    key,
    label: fieldLabel(key),
    value: formatValue(normalized[key], fieldMap[key]?.type),
  }))
  return { missing, subjective }
}

function automationPrompt() {

    return `${field.key}: ${type}${options}`
  }).join("\n")
  return `You are preparing inputs for Eval System 2, a classification-aware valuation engine. Extract and estimate a complete JSON payload from the attached annual report, 10-K/20-F/financial report, investor presentation, and current market data.

Return only valid JSON with this shape:
{
  "inputs": { ...all available engine fields... },
  "sourceNotes": { "fieldName": "source or calculation used" },
  "humanReview": [{ "field": "fieldName", "reason": "why the value needs review" }]
}

Rules:
- Use numeric values only. Money is USD. Percent fields are decimal ratios: 12.5% becomes 0.125.
- Prefer latest fiscal year annual values. Use trailing twelve months only when annual data is unavailable; note it.
- Revenue growth = (latest annual revenue - prior annual revenue) / prior annual revenue.
- Gross margin = gross profit / revenue. OpEx ratio = operating expenses / revenue, where operating expenses are gross profit minus operating income if the report does not label total operating expenses cleanly.
- Debt should be interest-bearing debt, finance leases, notes payable, and short-term borrowings. Do not treat bank customer deposits as ordinary debt for a bank.
- Cash should include cash, equivalents, and marketable securities unless restricted.
- CapEx % revenue = capital expenditures / revenue.
- AR, AP, and inventory should come from the balance sheet when material to the business.
- Market cap comes from share price times diluted/basic shares outstanding, or a current quote service. Use marketCapOverride when available.
- EPS should be diluted EPS from continuing operations when available.
- Direct competitor multiples should come from 4-8 close public peers, same business model first, same sector second. Include EV/revenue, EV/EBITDA, EV/FCF, P/E, peer revenue growth, peer gross margin, peer EBITDA margin, peer net margin, and peer net debt/revenue.
- TAM/SAM and sector CAGR may come from market reports, company filings, industry associations, or analyst consensus. Use conservative base-case numbers and flag if estimated.
- For brand/qualitative inputs, estimate from evidence and flag the estimate. Customer recognition is target-market recognition, not general-population awareness.
- Do not infer a high moat from a strong brand twice. Brand inputs measure demand-side trust/recognition/habit. Moat inputs measure structural defensibility.

Engine field schema:
${schema}`
}

function money(value) {
  return new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    notation: Math.abs(value) >= 1_000_000 ? "compact" : "standard",
    maximumFractionDigits: Math.abs(value) >= 1_000_000 ? 1 : 0,
  }).format(value || 0)
}

function pct(value, digits = 0) {
  return `${((value || 0) * 100).toFixed(digits)}%`
}

function formatValue(value, type) {
  if (type === "money") return money(value)
  if (type === "percent") return pct(value, 1)
  if (type === "multiple") return `${Number(value || 0).toFixed(2)}x`
  if (type === "checkbox") return value ? "Yes" : "No"
  return String(value ?? "")
}

function inputDisplayValue(value, type) {
  if (type === "percent") return Math.round((value || 0) * 1000) / 10
  return value
}

function parseInputValue(value, type, checked) {
  if (type === "checkbox") return checked
  const numeric = Number(value)
  if (type === "percent") return Number.isFinite(numeric) ? numeric / 100 : 0
  if (["money", "number", "score", "score5", "multiple"].includes(type)) return Number.isFinite(numeric) ? numeric : 0
  return value
}

function fieldVisible(field, context) {
  if (field.advanced) {
    if (["inventory", "ar", "ap"].includes(field.key)) return context.modules.inventoryRelevant
    if (field.key === "customerPrepaymentPct") return state.inputs.backlogValue > 0 || state.inputs.customerPrepaymentPct > 0
    if (/^asset[3-6](Type|Value)$/.test(field.key)) {
      const slot = field.key.match(/^asset([3-6])/)[1]
      return state.inputs[`asset${slot}Value`] > 0 || state.inputs[`asset${slot}Type`] !== "None"
    }
    return false
  }
  if (field.group === "Backlog") return context.modules.regulated || context.modules.assetHeavy || context.relevance.maturity < 0.75 || state.inputs.backlogValue > 0
  if (field.group === "Direct Comps") return true
  if (["tangibleBookValue", "assetBackingValue", "roe", "rotce"].includes(field.key)) return context.modules.financial || context.modules.assetHeavy || state.inputs.tangibleBookValue > 0 || state.inputs.assetBackingValue > 0
  if (/^asset[1-2](Type|Value)$/.test(field.key)) return true
  if (["retailRevenuePct", "retailGrossMargin", "subscriptionRevenuePct", "subscriptionGrossMargin"].includes(field.key)) {
    return context.modules.assetHeavy || context.modules.recurring || state.inputs.retailRevenuePct > 0 || state.inputs.subscriptionRevenuePct > 0
  }
  if (["recurringRevenuePct", "nrr", "churn"].includes(field.key)) return context.modules.recurring
  if (["pipelineValue", "pipelineConversion"].includes(field.key)) return context.modules.recurring || context.modules.marketplace || context.relevance.maturity < 0.75 || state.inputs.pipelineValue > 0
  if (["managementScore", "gtmScore"].includes(field.key)) return context.relevance.management > 0.38
  if (["dataAdvantageScore", "networkEffectScore", "ipScore", "acquirerPool", "strategicPremiumFlag"].includes(field.key)) {
    return context.relevance.strategicOptionality > 0.08 || state.inputs.strategicPremiumFlag
  }
  if (field.key === "consumerHabitStrength") return ["Consumers", "Mixed / Multiple"].includes(state.inputs.clientType)
  if (field.key === "institutionalReliance") return state.inputs.clientType !== "Consumers"
  if (["switchingCostScore", "moatScore"].includes(field.key)) return true
  if (["techReadiness", "regulatoryRisk"].includes(field.key)) return context.modules.regulated || context.modules.rAndD
  if (["buybackYield", "dividendYield", "sharePrice", "sharesOutstanding", "marketCapOverride"].includes(field.key)) return state.inputs.capitalStatus === "Public"
  return true
}

function option(value, selectedValue) {
  return `<option value="${escapeHtml(value)}" ${value === selectedValue ? "selected" : ""}>${escapeHtml(value)}</option>`
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
}

function renderField(field) {
  const value = state.inputs[field.key]
  const sourceStatus = state.ingestionAudit?.fieldStatus?.[field.key]
  const isMissingNumeric = sourceStatus === "missing" && typeof value === "number" && value === 0
  const sourceText = sourceStatus === "measured-zero"
    ? "Measured zero from source"
    : sourceStatus === "missing"
      ? "Missing - enter or verify"
      : sourceStatus === "manual-zero"
        ? "Manual zero"
        : formatValue(value, field.type)
  if (field.type === "select") {
    return `
      <label class="field">
        <span>${field.label}</span>
        <select data-field="${field.key}">
          ${field.options.map((item) => option(item, value)).join("")}
        </select>
      </label>
    `
  }
  if (field.type === "checkbox") {
    return `
      <label class="field field--checkbox">
        <input type="checkbox" data-field="${field.key}" ${value ? "checked" : ""} />
        <span>${field.label}</span>
      </label>
    `
  }
  const min = field.type === "score" || field.type === "score5" ? "1" : ""
  const max = field.type === "score" ? "10" : field.type === "score5" ? "5" : ""
  const step = field.type === "money" ? "1000" : field.type === "number" ? "1" : "0.1"
  return `
    <label class="field">
      <span>${field.label}</span>
      <input data-field="${field.key}" type="${field.type === "text" ? "text" : "number"}" value="${isMissingNumeric ? "" : escapeHtml(inputDisplayValue(value, field.type))}" min="${min}" max="${max}" step="${step}" />
      <small class="${sourceStatus === "missing" ? "field-source--missing" : sourceStatus === "measured-zero" || sourceStatus === "manual-zero" ? "field-source--verified" : ""}">${escapeHtml(sourceText)}</small>
    </label>
  `
}

function renderTags() {
  const selected = new Set(state.inputs.tags || [])
  return `
    <section class="panel">
      <div class="section-title">
        <h2>Tags</h2>
        <button class="ghost" data-action="toggle-advanced">${state.advanced ? "Hide Advanced" : "Show Advanced"}</button>
      </div>
      <div class="tag-grid">
        ${TAXONOMY.tags.map((tag) => `
          <label class="tag ${selected.has(tag) ? "tag--selected" : ""}">
            <input type="checkbox" data-tag="${escapeHtml(tag)}" ${selected.has(tag) ? "checked" : ""} />
            <span>${escapeHtml(tag)}</span>
          </label>
        `).join("")}
      </div>
    </section>
  `
}

function renderInputs() {
  const context = deriveContext(normalizeInputs(state.inputs))
  const visibleFields = fields.filter((field) => !field.advanced && fieldVisible(field, context))
  const stepIndex = Math.max(0, Math.min(state.step, wizardSteps.length - 1))
  state.step = stepIndex
  const step = wizardSteps[stepIndex]
  const stepFields = visibleFields.filter((field) => step.groups.includes(field.group))
  const groups = [...new Set(stepFields.map((field) => field.group))]
  return `
    <div class="wizard">
      <section class="panel wizard-shell">
        <div class="wizard-steps">
          ${wizardSteps.map((item, index) => `
            <button data-step="${index}" class="${index === stepIndex ? "active" : ""}">
              <span>${index + 1}</span>
              ${escapeHtml(item.title)}
            </button>
          `).join("")}
        </div>
      </section>
      <div class="input-layout">
        ${groups.map((group) => `
          <section class="panel">
            <div class="section-title">
              <h2>${group}</h2>
            </div>
            <div class="field-grid">
              ${stepFields.filter((field) => field.group === group).map(renderField).join("")}
            </div>
          </section>
        `).join("")}
        <section class="panel wizard-actions">
          <button class="ghost" data-action="prev-step" ${stepIndex === 0 ? "disabled" : ""}>Previous</button>
          <div>
            <strong>${stepIndex + 1} / ${wizardSteps.length}</strong>
          </div>
          <button class="primary" data-action="${stepIndex === wizardSteps.length - 1 ? "run-valuation" : "next-step"}">${stepIndex === wizardSteps.length - 1 ? "View Valuation" : "Next"}</button>
        </section>
      </div>
    </div>
  `
}

function renderAllFieldsReview() {
  const context = deriveContext(normalizeInputs(state.inputs))
  const visibleFields = fields.filter((field) => state.advanced || fieldVisible(field, context))
  const groups = [...new Set(visibleFields.map((field) => field.group))]
  const crossChecks = state.ingestionAudit?.crossChecks || []
  const matchedChecks = crossChecks.filter((check) => check.status === "matched").length
  const measuredZeros = Object.values(state.ingestionAudit?.fieldStatus || {}).filter((status) => status === "measured-zero").length
  const auditIssues = [
    ...(state.ingestionAudit?.missing || []).map((field) => `Missing: ${fieldLabel(field)}`),
    ...(state.ingestionAudit?.warnings || []),
  ]
  return `
    <section class="panel review-all-panel">
      <div class="section-title">
        <div>
          <p class="eyebrow">Exception review</p>
          <h2>All Engine Fields</h2>
        </div>
        <div class="section-actions">
          <button class="ghost" data-action="toggle-advanced">${state.advanced ? "Hide Optional Fields" : "Show Optional Fields"}</button>
          <button class="ghost" data-action="toggle-review-all">Close</button>
        </div>
      </div>
      <p class="muted">Edit only a value that the source audit marks missing or incorrect. Derived ratios will be replaced by your explicit override.</p>
      ${(crossChecks.length || measuredZeros) ? `
        <div class="source-strip">
          ${crossChecks.length ? `<span class="pill">${matchedChecks}/${crossChecks.length} cross-source checks matched</span>` : ""}
          ${measuredZeros ? `<span class="pill">${measuredZeros} measured zero${measuredZeros === 1 ? "" : "s"}</span>` : ""}
        </div>
      ` : ""}
      ${auditIssues.length ? `<div class="warning-list">${auditIssues.map((issue) => `<div class="warning">${escapeHtml(issue)}</div>`).join("")}</div>` : ""}
      ${groups.map((group) => `
        <div class="review-field-group">
          <h3>${escapeHtml(group)}</h3>
          <div class="field-grid">${visibleFields.filter((field) => field.group === group).map(renderField).join("")}</div>
        </div>
      `).join("")}
    </section>
  `
}

function renderNeedsAttention() {
  const audit = state.ingestionAudit
  if (!audit || audit.error) return ""
  const missingFields = Object.entries(audit.fieldStatus || {})
    .filter(([, status]) => status === "missing")
    .map(([key]) => fieldMap[key])
    .filter(Boolean)
  if (!missingFields.length) return ""
  return `
    <section class="panel needs-attention-panel">
      <div class="section-title">
        <div>
          <p class="eyebrow">Action needed</p>
          <h2>${missingFields.length} Field${missingFields.length === 1 ? "" : "s"} Need Your Input</h2>
        </div>
      </div>
      <p class="muted">No connected source returned a value for these — enter them directly below. Everything else loaded automatically.</p>
      <div class="field-grid">${missingFields.map(renderField).join("")}</div>
    </section>
  `
}

function renderResults(result) {
  const warnings = [...result.errors.map((item) => `Error: ${item}`), ...result.warnings]
  const comparison = result.ledger.budgets.financialComparison
  // Headline comparison anchors to the REAL, current market value — a 20-day trailing
  // average can diverge sharply from today's actual price after a rally/selloff, which
  // previously made "implied vs market" wildly misleading (e.g. showing 70% upside on a
  // $1.1B implied value against a real $1B market cap). The average is still shown as
  // supplementary context below, never as the primary percentage's denominator.
  const currentMarketValue = state.marketSnapshot?.currentMarketCap || result.tracks.market.paths.observedEquity || 0
  const averageMarketValue = state.marketSnapshot?.averageMarketCap || 0
  const valueDifference = impliedValueDifference(result.outputs.fairCommonEquity, currentMarketValue)
  const averageWindow = state.marketSnapshot?.tradingDays || 0
  const averageDiffersMeaningfully = averageMarketValue > 0 && currentMarketValue > 0 && Math.abs(averageMarketValue - currentMarketValue) / currentMarketValue > 0.01
  const trackRows = [
    ["DCF", "dcf", result.tracks.dcf],
    ["Direct Comps", "directComps", result.tracks.directComps],
    ["Industry Baseline", "industry", result.tracks.industry],

            <h2>${money(result.outputs.fairCommonEquity)}</h2>

            ${averageDiffersMeaningfully ? `<p class="muted">${averageWindow}-day avg ${money(averageMarketValue)}</p>` : ""}

          <div class="difference-block ${valueDifference !== null && valueDifference < 0 ? "difference-block--negative" : ""}">
