    <style>
:root {
  color-scheme: light;
  --bg: #eef2f6;
  --panel: #ffffff;
  --panel-2: #f7f9fc;
  --ink: #142033;
  --muted: #647286;
  --line: #d7dee8;
  --line-strong: #aeb9c8;
  --accent: #1f5f91;
  --accent-2: #2f7a55;
  --warn: #9a5b12;
  --warn-bg: #fff3dc;
  --warn-border: #e3c184;
  --track-bg: #e6ecf3;
  --pill-bg: #e6f1f8;
  --tag-selected-bg: #eef6fb;
  --tag-selected-border: #83a9c3;
  --shadow: 0 12px 30px rgba(20, 32, 51, 0.08);
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-family: var(--font-sans);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b1220;
    --panel: #141d2e;
    --panel-2: #1a2438;
    --ink: #e7edf7;
    --muted: #93a2ba;
    --line: #263349;
    --line-strong: #374765;
    --accent: #6fa8d8;
    --accent-2: #5fbf8c;
    --warn: #e8b567;
    --warn-bg: #2e2510;
    --warn-border: #6b551f;
    --track-bg: #202c42;
    --pill-bg: #1c3348;
    --tag-selected-bg: #1c3348;
    --tag-selected-border: #4a7fac;
    --shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1220;
  --panel: #141d2e;
  --panel-2: #1a2438;
  --ink: #e7edf7;
  --muted: #93a2ba;
  --line: #263349;
  --line-strong: #374765;
  --accent: #6fa8d8;
  --accent-2: #5fbf8c;
  --warn: #e8b567;
  --warn-bg: #2e2510;
  --warn-border: #6b551f;
  --track-bg: #202c42;
  --pill-bg: #1c3348;
  --tag-selected-bg: #1c3348;
  --tag-selected-border: #4a7fac;
  --shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
}

* {
  box-sizing: border-box;
}

html,
body,
#app {
  min-height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
}

#app {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
}

.sidebar {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 22px;
  padding: 24px 18px;
  background: #101827;
  color: #edf3fb;
}

.sidebar h1,
.topbar h1 {
  margin: 4px 0 0;
  line-height: 1.05;
}

.sidebar nav,
.fixture-list {
  display: grid;
  gap: 8px;
}

.fixture-list {
  margin-top: auto;
}

.fixture-list span,
.eyebrow,
.muted,
.field small,
.rail small,
.budget-card small,
.detail-grid small,
.track-card small,
.track-card span,
.detail-grid span,
.hero-metrics span {
  color: var(--muted);
}

.sidebar .eyebrow,
.sidebar .fixture-list span {
  color: #aebbd0;
}

button,
select,
input {
  font: inherit;
}

button {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  background: #ffffff;
  color: var(--ink);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.sidebar button {
  width: 100%;
  text-align: left;
  background: rgba(255, 255, 255, 0.08);
  color: #edf3fb;
  border-color: rgba(255, 255, 255, 0.12);
}

button.active,
.primary {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
}

.ghost {
  background: transparent;
  color: var(--accent);
  border-color: var(--line-strong);
}

.sidebar .ghost--sidebar {
  color: #edf3fb;
  border-color: rgba(255, 255, 255, 0.22);
}

main {
  min-width: 0;
  padding: 24px 28px 36px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  margin-bottom: 18px;
}

.topbar-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.mode-toggle {
  display: inline-grid;
  grid-template-columns: repeat(2, minmax(86px, 1fr));
  gap: 4px;
  padding: 4px;
  border-radius: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
}

.mode-toggle button {
  border-radius: 6px;
  padding: 8px 10px;
  border-color: transparent;
}

.panel {
  min-width: 0;
  overflow-x: auto;
  padding: 18px;
  border-radius: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.input-layout,
.results-layout,
.wizard,
.auto-layout {
  display: grid;
  gap: 16px;
}

.intake-panel {
  display: grid;
  gap: 14px;
}

.upload-box {
  display: grid;
  gap: 8px;
  min-height: 140px;
  place-items: center;
  text-align: center;
  padding: 22px;
  border-radius: 8px;
  border: 1px dashed var(--line-strong);
  background: var(--panel-2);
  cursor: pointer;
}

.upload-box input {
  width: 100%;
  max-width: 320px;
}

.auto-grid,
.review-grid {
  display: grid;
  gap: 12px;
}

.auto-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.auto-grid div,
.review-grid > div {
  min-width: 0;
  display: grid;
  gap: 8px;
  padding: 14px;
  border-radius: 8px;
  background: var(--panel-2);
  border: 1px solid var(--line);
}

.auto-grid span,
.review-grid span {
  color: var(--muted);
}

.auto-grid strong {
  font-size: 22px;
}

.json-box,
.prompt-box {
  width: 100%;
  min-height: 220px;
  resize: vertical;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 12px;
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: #ffffff;
  color: var(--ink);
}

.prompt-box {
  min-height: 360px;
}

.status-line {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--muted);
}

.review-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.review-grid h3 {
  margin: 0;
  font-size: 16px;
}

.review-grid ul {
  display: grid;
  gap: 7px;
  margin: 0;
  padding-left: 18px;
}

.review-grid li {
  min-width: 0;
}

.review-grid li strong {
  display: block;
  overflow-wrap: anywhere;
}

.wizard-shell {
  padding: 12px;
}

.wizard-steps {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;
}

.wizard-steps button {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 8px;
  border-radius: 8px;
}

.wizard-steps span {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 999px;
  background: var(--panel-2);
  color: var(--muted);
  font-weight: 800;
}

.wizard-steps .active span {
  background: rgba(255, 255, 255, 0.18);
  color: #ffffff;
}

.wizard-actions {
  display: grid;
  grid-template-columns: 140px minmax(0, 1fr) 140px;
  align-items: center;
  gap: 12px;
}

.wizard-actions div {
  text-align: center;
}

.section-title {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.section-title h2 {
  margin: 0;
  font-size: 19px;
}

.field-grid,
.track-grid,
.detail-grid,
.hero-metrics,
.ledger-grid {
  display: grid;
  gap: 12px;
}

.field-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.field {
  display: grid;
  gap: 6px;
  min-width: 0;
  padding: 12px;
  border-radius: 8px;
  background: var(--panel-2);
  border: 1px solid var(--line);
}

.field span {
  font-weight: 700;
}

.field-source--missing {
  color: var(--warn);
  font-weight: 700;
}

.field-source--verified {
  color: var(--accent-2);
  font-weight: 700;
}

.field input,
.field select {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 9px 10px;
  background: #ffffff;
}

.field--checkbox {
  grid-template-columns: 18px minmax(0, 1fr);
  align-items: center;
}

.field--checkbox input {
  width: 18px;
  height: 18px;
}

.tag-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.tag {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  min-width: 0;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
  cursor: pointer;
}

.tag--selected {
  border-color: #83a9c3;
  background: #eef6fb;
}

.hero-panel {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 18px;
  align-items: start;
}

.hero-panel h2 {
  margin: 8px 0;
  font-size: 42px;
  line-height: 1;
  overflow-wrap: anywhere;
}

.hero-metrics,
.track-grid,
.detail-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.hero-metrics div,
.track-card,
.detail-grid div,
.budget-card {
  min-width: 0;
  display: grid;
  gap: 7px;
  padding: 14px;
  border-radius: 8px;
  background: var(--panel-2);
  border: 1px solid var(--line);
}

.track-card--muted {
  opacity: 0.58;
}

.hero-metrics strong,
.track-card strong,
.detail-grid strong,
.budget-card strong {
  font-size: 21px;
  overflow-wrap: anywhere;
}

.ledger-grid {
  grid-template-columns: 240px 240px minmax(0, 1fr);
  align-items: start;
}

.signal-stack {
  display: grid;
  gap: 10px;
  min-width: 0;
}

.rail {
  display: grid;
  gap: 7px;
  min-width: 0;
}

.rail__top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
}

.rail__track {
  height: 9px;
  overflow: hidden;
  border-radius: 999px;
  background: #e6ecf3;
}

.rail__track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}

.pill {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 7px 10px;
  font-weight: 700;
  color: var(--accent);
  background: #e6f1f8;
}

.pill--warn,
.warning {
  color: var(--warn);
  background: var(--warn-bg);
}

.warning-list {
  display: grid;
  gap: 10px;
}

.warning {
  padding: 12px;
  border: 1px solid #e3c184;
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  overflow: hidden;
}

.ticker-entry {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto;
  gap: 12px;
  align-items: end;
}

.ticker-entry .field {
  margin: 0;
}

.source-strip,
.intake-actions,
.section-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.needs-attention-panel {
  border: 2px solid var(--warn-border);
  background: var(--warn-bg);
}

.needs-attention-panel .eyebrow,
.needs-attention-panel h2 {
  color: var(--warn);
}

.needs-attention-panel .field input,
.needs-attention-panel .field select {
  border-color: var(--warn-border);
}

.review-alert {
  display: grid;
  gap: 3px;
  padding: 12px 14px;
  border: 1px solid var(--warn-border);
  border-radius: 8px;
  color: var(--warn);
  background: var(--warn-bg);
}

.status-line--error {
  color: #a33a32;
}

.review-all-panel {
  display: grid;
  gap: 20px;
}

.review-field-group {
  display: grid;
  gap: 10px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.review-field-group h3 {
  margin: 0;
  font-size: 14px;
}

.ai-fallback summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  font-weight: 700;
}

.ai-fallback[open] {
  display: grid;
  gap: 14px;
}

.upload-box--compact {
  min-height: 90px;
  padding: 14px;
}

.valuation-comparison {
  display: grid;
  grid-template-columns: minmax(210px, 1.25fr) minmax(190px, 1fr) minmax(170px, 0.8fr);
  gap: 16px;
  width: 100%;
}

.market-value-block,
.difference-block {
  display: grid;
  align-content: center;
  gap: 5px;
  min-width: 0;
  padding-left: 16px;
  border-left: 1px solid var(--line);
}

.market-value-block h3,
.difference-block strong {
  margin: 0;
  font-size: 24px;
}

.difference-block strong {
  color: var(--accent-2);
}

.difference-block--negative strong {
  color: #a33a32;
}

th,
td {
  padding: 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

th {
  color: var(--muted);
  font-size: 13px;
}

@media (max-width: 1040px) {
  #app,
  .hero-panel,
  .ledger-grid,
  .wizard-steps,
  .wizard-actions,
  .field-grid,
  .tag-grid,
  .hero-metrics,
  .track-grid,
  .detail-grid,
  .auto-grid,
  .review-grid {
    grid-template-columns: 1fr;
  }

  .valuation-comparison {
    grid-template-columns: 1fr;
  }

  .market-value-block,
  .difference-block {
    padding: 12px 0 0;
    border-left: 0;
    border-top: 1px solid var(--line);
  }

  .sidebar {
    min-height: auto;
  }
}

@media (max-width: 640px) {
  main,
  .sidebar {
    padding: 14px;
  }

  .topbar {
    display: grid;
  }

  .topbar-actions {
    justify-content: stretch;
  }

  .mode-toggle {
    width: 100%;
  }

  .ticker-entry {
    grid-template-columns: 1fr;
  }

  .hero-panel h2 {
    font-size: 32px;
  }
}

function clamp(value, min, max) {
  const numeric = Number.isFinite(value) ? value : min
  return Math.min(Math.max(numeric, min), max)
}

function asNumber(value, fallback = 0) {
  const numeric = Number(value)
  return Number.isFinite(numeric) ? numeric : fallback
}

function round(value, digits = 4) {
  if (!Number.isFinite(value)) return 0
  const factor = 10 ** digits
  return Math.round(value * factor) / factor
}

function div(numerator, denominator, fallback = 0) {
  return Number.isFinite(numerator) && Number.isFinite(denominator) && Math.abs(denominator) > 1e-9
    ? numerator / denominator
    : fallback
}

function impliedValueDifference(impliedValue, marketValue) {
  const implied = Number(impliedValue)
  const market = Number(marketValue)
  return Number.isFinite(implied) && Number.isFinite(market) && market > 0
    ? (implied - market) / market
    : null
}

function weightedAverage(items) {
  const total = items.reduce((sum, item) => sum + item.weight, 0)
  return total > 0 ? items.reduce((sum, item) => sum + item.value * item.weight, 0) / total : 0
}

function normalizeWeights(weights, caps = {}) {
  const raw = Object.fromEntries(Object.entries(weights).map(([key, value]) => [key, Math.max(asNumber(value), 0)]))
  let total = Object.values(raw).reduce((sum, value) => sum + value, 0)
  if (total <= 0) {
    const keys = Object.keys(raw)
    return Object.fromEntries(keys.map((key) => [key, round(1 / keys.length)]))
  }
  let normalized = Object.fromEntries(Object.entries(raw).map(([key, value]) => [key, value / total]))
  for (let i = 0; i < 8; i += 1) {
    let overflow = 0
    const open = []
    for (const [key, value] of Object.entries(normalized)) {
      const cap = caps[key] ?? 1
      if (value > cap) {
        overflow += value - cap
        normalized[key] = cap
      } else {
        open.push(key)
      }
    }
    if (overflow <= 1e-9 || !open.length) break
    const openTotal = open.reduce((sum, key) => sum + normalized[key], 0)
    for (const key of open) normalized[key] += overflow * div(normalized[key], openTotal)
  }
  total = Object.values(normalized).reduce((sum, value) => sum + value, 0)
  return Object.fromEntries(Object.entries(normalized).map(([key, value]) => [key, round(div(value, total))]))
}

function logScore(value, midpoint, steepness) {
  return clamp(1 / (1 + Math.exp(-(Math.log10(Math.max(value, 1)) - midpoint) * steepness)), 0, 1)
}

function decayedMultipleFactor(score, floor = 0.25, ceiling = 2.5, options = {}) {
  const bounded = clamp(score, -1, 1)
  const upsideSensitivity = options.upsideSensitivity ?? 1.18
  const downsideSensitivity = options.downsideSensitivity ?? 1.85
  const upsidePower = options.upsidePower ?? 0.78
  const downsidePower = options.downsidePower ?? 1.08
  if (bounded >= 0) {
    const curved = Math.tanh(bounded * upsideSensitivity) / Math.tanh(upsideSensitivity)
    return 1 + (ceiling - 1) * curved ** upsidePower
  }
  const curved = Math.tanh(Math.abs(bounded) * downsideSensitivity) / Math.tanh(downsideSensitivity)
  return 1 - (1 - floor) * curved ** downsidePower
}

// Soft, smooth replacement for a hard clamp on an applied multiple. Above the
// band top the excess is compressed with diminishing returns (tanh) toward a
// higher asymptotic ceiling, so premium names can trade above the band without
// running away. Below the band bottom the deficit is compressed the same way
// toward a lifted floor, giving weak names a slight pull-up instead of collapsing.
function softBand(value, lo, hi, options = {}) {
  if (!(hi > 0) || !(lo > 0)) return Math.max(value, 0)
  const ceilingMult = options.ceilingMult ?? 3.6
  const floorMult = options.floorMult ?? 0.4
  const softness = options.softness ?? 1.25
  const hardMax = hi * ceilingMult
  const hardMin = lo * floorMult
  if (value > hi) return hi + (hardMax - hi) * Math.tanh((value - hi) / (softness * hi))
  if (value < lo) return lo - (lo - hardMin) * Math.tanh((lo - value) / (softness * lo))
  return value
}

function validateChoice(value, choices, fallback) {
  return choices.includes(value) ? value : fallback
}

function deriveSizeContext(input) {
  const marketBase = input.sam > 0 ? input.sam : input.tam
  const marketKnown = marketBase > 0
  const marketShare = marketKnown ? div(input.revenue, marketBase) : 0
  const tamScale = logScore(input.tam, 9.15, 1.05)
  const samScale = logScore(input.sam, 8.6, 1.15)
  const revenueScale = logScore(input.revenue, 7.15, 1.18)
  const marketSharePosition = marketKnown ? clamp(Math.log10(1 + marketShare * 120) / Math.log10(49), 0, 1) : 0.5
  const marketSizeScore = marketKnown
    ? weightedAverage([
      { value: samScale, weight: input.sam > 0 ? 0.68 : 0 },
      { value: tamScale, weight: input.tam > 0 ? 0.32 : 0 },
    ])
    : 0.5
  const listingScaleAnchor = {
    Public: 1,
    "Private Equity / Late Private": 0.66,
    "Series C+": 0.5,
    "Series B": 0.38,
    "Series A": 0.28,
    Seed: 0.18,
    "Pre-seed": 0.12,
    "Bootstrapped / Private": 0.24,
    "SMB / Owner-Operated": 0.36,
  }[input.capitalStatus] ?? 0.22
  const sizeScore = weightedAverage([
    { value: marketSharePosition, weight: 0.32 },
    { value: marketSizeScore, weight: 0.28 },
    { value: revenueScale, weight: 0.22 },
    { value: listingScaleAnchor, weight: 0.18 },
  ])
  const marketRoom = clamp(1 - marketSharePosition * 0.48, 0.52, 1)
  const className = sizeScore >= 0.72
    ? "large / market-anchored"
    : sizeScore >= 0.5
      ? "mid-scale"
      : sizeScore >= 0.28
        ? "emerging"
        : "small / early-scale"

  return {
    marketKnown,
    marketBase: round(marketBase, 2),
    marketShare: round(marketShare),
    marketSharePosition: round(marketSharePosition),
    marketSizeScore: round(marketSizeScore),
    revenueScale: round(revenueScale),
    listingScaleAnchor: round(listingScaleAnchor),
    sizeScore: round(sizeScore),
    marketRoom: round(marketRoom),
    className,
  }
}

  normalized.competitorCount = clamp(Math.round(normalized.competitorCount), 0, 12)
  normalized.competitorEvRevenue = clamp(normalized.competitorEvRevenue, 0, 80)
  normalized.competitorEvEbitda = clamp(normalized.competitorEvEbitda, 0, 80)
  normalized.competitorEvFcf = clamp(normalized.competitorEvFcf, 0, 100)
  normalized.competitorPe = clamp(normalized.competitorPe, 0, 300)
  normalized.competitorRevenueGrowth = clamp(normalized.competitorRevenueGrowth, -0.8, 3)
  normalized.competitorGrossMargin = clamp(normalized.competitorGrossMargin, -0.5, 0.98)
  normalized.competitorEbitdaMargin = clamp(normalized.competitorEbitdaMargin, -0.8, 0.75)
  normalized.competitorNetMargin = clamp(normalized.competitorNetMargin, -0.8, 0.75)
  normalized.competitorNetDebtRevenue = clamp(normalized.competitorNetDebtRevenue, -5, 10)
  normalized.tangibleBookValue = Math.max(normalized.tangibleBookValue, 0)
  normalized.assetBackingValue = Math.max(normalized.assetBackingValue, 0)
  for (let index = 1; index <= 6; index += 1) {
    normalized[`asset${index}Value`] = Math.max(normalized[`asset${index}Value`], 0)
  }
  normalized.roe = clamp(normalized.roe, -1, 1)
  normalized.rotce = clamp(normalized.rotce, -1, 1)
  normalized.competitionIntensity = clamp(normalized.competitionIntensity, 1, 5)
  normalized.yearsOperating = clamp(normalized.yearsOperating, 0, 200)
  normalized.targetMarketRecognitionPct = clamp(normalized.targetMarketRecognitionPct, 0, 1)
  normalized.customerTrustScore = clamp(normalized.customerTrustScore, 1, 10)
  normalized.purchaseFrequency = clamp(normalized.purchaseFrequency, 1, 10)
  normalized.missionCriticality = clamp(normalized.missionCriticality, 1, 10)
  normalized.institutionalReliance = clamp(normalized.institutionalReliance, 1, 10)
  normalized.consumerHabitStrength = clamp(normalized.consumerHabitStrength, 1, 10)
  normalized.expectedDilution = clamp(normalized.expectedDilution, 0, 0.65)
  normalized.buybackYield = clamp(normalized.buybackYield, 0, 0.2)
  normalized.dividendYield = clamp(normalized.dividendYield, 0, 0.2)
  normalized.eps = clamp(normalized.eps, -10_000, 100_000)
  normalized.sharePrice = Math.max(normalized.sharePrice, 0)
  normalized.sharesOutstanding = Math.max(normalized.sharesOutstanding, 0)
  normalized.marketCapOverride = Math.max(normalized.marketCapOverride, 0)
  normalized.terminalGrowth = clamp(normalized.terminalGrowth, 0.01, 0.08)
  normalized.projectionYears = clamp(Math.round(normalized.projectionYears), 3, 10)

  return normalized
}

const BRAND_RELEVANCE_BY_MODEL = {
  "Software / Subscription": 0.5,
  "Marketplace / Network Platform": 0.55,
  "Services / Labor-Based": 0.55,
  "Product / Hardware": 0.6,
  "Tools / Devices / Equipment": 0.45,
  "Manufacturing / Production": 0.35,
  "Retail / Commerce / Distribution": 0.85,
  "Asset-Heavy Operator": 0.35,
  "Franchise / Multi-Location Operator": 0.8,
  "IP / Licensing / Royalty": 0.45,
  "Biopharma / R&D Asset": 0.2,
  "Financial / Balance-Sheet Business": 0.55,
  Hybrid: 0.5,
  Other: 0.5,
}

const STRUCTURAL_RELEVANCE_BY_MODEL = {
  "Software / Subscription": 0.85,
  "Marketplace / Network Platform": 0.9,
  "Services / Labor-Based": 0.4,
  "Product / Hardware": 0.55,
  "Tools / Devices / Equipment": 0.55,
  "Manufacturing / Production": 0.42,
  "Retail / Commerce / Distribution": 0.4,
  "Asset-Heavy Operator": 0.45,
  "Franchise / Multi-Location Operator": 0.42,
  "IP / Licensing / Royalty": 0.75,
  "Biopharma / R&D Asset": 0.72,
  "Financial / Balance-Sheet Business": 0.55,
  Hybrid: 0.6,
  Other: 0.55,
}

const REACH_SCORE = { Local: 0.3, Regional: 0.52, National: 0.78, Global: 1 }

const INSTITUTIONAL_CLIENTS = new Set([
  "Banks / Financial Institutions",
  "Government / Public Sector",
  "Municipalities",
  "Hospitals / Healthcare Providers",
  "Schools / Education",
])

// Brand durability is demand-side: who the customer is decides whether consumer
// habit or institutional reliance is the relevant stickiness input, and how much
// brand drives value at all for this business type / sector.
function deriveBrandContext(input, tagSet, size) {
  const t = input.clientType
  const consumerWeight = t === "Consumers" ? 1 : t === "Mixed / Multiple" ? 0.55 : 0.12
  const institutionalWeight = INSTITUTIONAL_CLIENTS.has(t) ? 1 : t === "Enterprise / Business" ? 0.72 : t === "Mixed / Multiple" ? 0.6 : 0.15
  let relevance = BRAND_RELEVANCE_BY_MODEL[input.businessModel] ?? 0.5
  if (["Consumer Products / Retail / E-commerce", "Consumer Internet / Media / Gaming"].includes(input.sector)) relevance += 0.1
  else if (input.sector === "Agriculture / Food / Bioeconomy") relevance += 0.05
  else if (input.sector === "Biotech Therapeutics") relevance -= 0.1
  if (tagSet.has("Brand / Consumer Staples")) relevance += 0.06
  if (t === "Consumers") relevance += 0.04
  const structuralRelevance = clamp(
    (STRUCTURAL_RELEVANCE_BY_MODEL[input.businessModel] ?? 0.55) +
      (tagSet.has("Data / AI Advantage") ? 0.05 : 0) +
      (tagSet.has("Marketplace / Two-Sided Network") ? 0.05 : 0),
    0.2,
    0.95
  )
  return {
    relevance: round(clamp(relevance, 0.12, 0.95)),
    structuralRelevance: round(structuralRelevance),
    consumerWeight: round(consumerWeight),
    institutionalWeight: round(institutionalWeight),
    isConsumer: consumerWeight >= institutionalWeight,
    reachScore: REACH_SCORE[input.brandGeographicReach] ?? 0.52,
    tenureScore: round(clamp(Math.log10(1 + Math.max(input.yearsOperating, 0)) / Math.log10(51), 0, 1)),
  }
}

const REGIME_SOLIDITY = {
  "Established Rule of Law": 0.95,
  "Stable Democracy / Reforming": 0.72,
  "State Capitalist / Single-Party": 0.5,
  "Authoritarian / High-Intervention": 0.3,
  "Fragile / Unstable": 0.15,
}

const GOVERNMENT_POSTURE_BIAS = {
  "Adversarial / Targeted": -0.6,
  "Neutral / Market": 0,
  "Supported / Contracted": 0.4,
  "Protected / National Champion": 0.7,
}

// Sovereign / jurisdiction governance. The engine previously knew whether a company
// was regulated or government-linked, but not how SOLID the governing regime is — so
// state favor in a semi-authoritarian state read the same as a durable rule-of-law
// monopoly. Solidity (rule of law, property rights, minority protection, stability)
// sets a sovereign risk premium, a minority-shareholder multiple discount, and gates
// how durable any government tailwind actually is. State favor is worth more where the
// regime is solid and is a latent risk where it is not (the same state can reverse it).
function deriveJurisdiction(input) {
  const solidity = REGIME_SOLIDITY[input.governanceRegime] ?? 0.95
  const postureBias = GOVERNMENT_POSTURE_BIAS[input.governmentPosture] ?? 0
  const favor = Math.max(postureBias, 0)
  const hostility = Math.max(-postureBias, 0)
  // Discount-rate add-on: weak regimes carry sovereign risk; an adversarial state is a
  // direct hazard; favor granted by a weak state is a latent reversal risk.
  const sovereignRiskPremium = clamp(
    (1 - solidity) * 0.055 + hostility * 0.03 + favor * (1 - solidity) * 0.045,
    0,
    0.08
  )
  // Minority-shareholder / rule-of-law discount applied to the market multiple.
  const multipleFactor = clamp(0.68 + solidity * 0.32 - hostility * 0.05, 0.6, 1)
  // Government tailwind only counts as durable moat to the extent the regime honors it.
  const durableTailwind = clamp(favor * solidity, 0, 0.7)
  return {
    solidity: round(solidity),
    postureBias,
    sovereignRiskPremium: round(sovereignRiskPremium),
    multipleFactor: round(multipleFactor),
    durableTailwind: round(durableTailwind),
  }
}

function deriveContext(input) {
  const tagSet = new Set(input.tags)
  const size = deriveSizeContext(input)
  const recurring = input.businessModel === "Software / Subscription" || tagSet.has("Subscription / Recurring Revenue") || tagSet.has("Usage-Based")
  const marketplace = input.businessModel === "Marketplace / Network Platform" || tagSet.has("Marketplace / Two-Sided Network")
  // Balance-sheet (bank) valuation keys off the business model, NOT the Fintech sector —
  // a payments network or fintech platform (Visa, Mastercard) is network/software
  // economics, not a book-value lender, and must not be routed to the bank regime.
  const financial = input.businessModel === "Financial / Balance-Sheet Business"
  const assetHeavy = ["Asset-Heavy Operator", "Manufacturing / Production", "Retail / Commerce / Distribution"].includes(input.businessModel) || tagSet.has("Asset-Heavy Infrastructure")
  const inventoryRelevant = assetHeavy || tagSet.has("Inventory-Heavy") || input.businessModel === "Product / Hardware"
  const rAndD = input.businessModel === "Biopharma / R&D Asset" || tagSet.has("R&D / Pre-Commercial") || input.sector === "Biotech Therapeutics"
  const regulated = rAndD || tagSet.has("Regulated Approval Path") || ["Medical Devices", "Aerospace / Space / Defense", "Fintech / Financial Services"].includes(input.sector)
  // Capital-intensive asset-base operators (utilities, energy, pipelines, infrastructure,
  // real-estate operators). Like banks, these are valued on their asset/rate base and a
  // regulated-return premium, not on free cash flow — they reinvest heavily by design, so
  // an FCF DCF structurally understates them and their asset-backed debt is normal leverage.
  const infrastructure = !financial && !rAndD && (
    input.businessModel === "Asset-Heavy Operator" ||
    (tagSet.has("Asset-Heavy Infrastructure") &&
      input.capexPct >= 0.12 &&
      ["FCF Positive", "Profitable", "Declining / Margin Compression"].includes(input.profitabilityStatus) &&
      ["Profitable / Mature", "Late-Stage Growth", "Declining / Turnaround"].includes(input.lifecycleStage))
  )
  const rawPublicAnchor = input.capitalStatus === "Public"
    ? input.profitabilityStatus === "FCF Positive" ? 0.86 : input.profitabilityStatus === "Profitable" ? 0.76 : 0.56
    : input.capitalStatus === "Private Equity / Late Private" ? 0.28 : 0.1
  const publicAnchor = clamp(rawPublicAnchor * (0.88 + size.listingScaleAnchor * 0.12), 0.08, 0.9)
  const maturity = {
    "Concept / Pre-Product": 0.08,
    "Prototype / Pre-Revenue": 0.16,
    "Early Commercial": 0.32,
    Scaling: 0.52,
    "Late-Stage Growth": 0.68,
    "Profitable / Mature": 0.86,
    "Declining / Turnaround": 0.7,
    Distressed: 0.25,
  }[input.lifecycleStage]
  const dcfReliability = clamp(
    (input.profitabilityStatus === "FCF Positive" ? 0.78 : input.profitabilityStatus === "Profitable" ? 0.65 : input.profitabilityStatus === "Near Breakeven" ? 0.45 : input.profitabilityStatus === "Pre-Revenue" ? 0.08 : 0.28) +
      maturity * 0.12 +
      publicAnchor * 0.08 +
      size.revenueScale * 0.04 +
      size.marketSharePosition * 0.025 +
      input.recurringRevenuePct * 0.05,
    0.05,
    0.9
  )

  const familyWeights = { ...(MODEL_FAMILY_WEIGHTS[input.businessModel] || MODEL_FAMILY_WEIGHTS.Other) }
  if (input.profitabilityStatus === "Pre-Revenue") {
    familyWeights.revenue *= 0.5
    familyWeights.ebitda *= 0.2
    familyWeights.fcf *= 0.15
    familyWeights.probability *= rAndD ? 1.5 : 1.15
  } else if (input.profitabilityStatus === "FCF Positive") {
    familyWeights.revenue *= 0.7
    familyWeights.ebitda *= 1.12
    familyWeights.fcf *= 1.28
  } else if (input.profitabilityStatus === "Profitable") {
    familyWeights.revenue *= 0.9
    familyWeights.ebitda *= 1.15
    familyWeights.fcf *= 1.08
  }
  if (assetHeavy) familyWeights.asset *= 1.2

  return {
    size,
    brand: deriveBrandContext(input, tagSet, size),
    jurisdiction: deriveJurisdiction(input),
    modules: { recurring, marketplace, financial, infrastructure, assetHeavy, inventoryRelevant, rAndD, regulated },
    relevance: {
      publicAnchor,
      maturity,
      dcfReliability,
      strategicOptionality: clamp((rAndD ? 0.35 : 0) + (marketplace ? 0.18 : 0) + (tagSet.has("Data / AI Advantage") ? 0.16 : 0) + (tagSet.has("IP / Licensing") ? 0.2 : 0), 0, 1),
      management: input.capitalStatus === "Public" ? 0.22 : input.capitalStatus === "SMB / Owner-Operated" ? 0.9 : clamp(0.75 - maturity * 0.3, 0.35, 0.9),
    },
    multipleFamilyWeights: normalizeWeights(familyWeights, { revenue: 0.85, ebitda: 0.82, fcf: 0.82, probability: 0.76, asset: 0.62 }),
  }
}

function blendedGrossMargin(input) {
  const retailWeight = input.retailRevenuePct
  const subscriptionWeight = input.subscriptionRevenuePct
  const explicitWeight = retailWeight + subscriptionWeight
  if (explicitWeight <= 0) {
    return {
      grossMargin: input.grossMargin,
      blendActive: false,
      retailContribution: 0,
      subscriptionContribution: 0,
      residualContribution: input.grossMargin,
    }
  }
  const normalizedRetailWeight = explicitWeight > 1 ? retailWeight / explicitWeight : retailWeight
  const normalizedSubscriptionWeight = explicitWeight > 1 ? subscriptionWeight / explicitWeight : subscriptionWeight
  const residualWeight = Math.max(1 - normalizedRetailWeight - normalizedSubscriptionWeight, 0)
  const grossMargin =
    normalizedRetailWeight * input.retailGrossMargin +
    normalizedSubscriptionWeight * input.subscriptionGrossMargin +
    residualWeight * input.grossMargin
  return {
    grossMargin: clamp(grossMargin, -0.5, 0.98),
    blendActive: true,
    retailContribution: normalizedRetailWeight * input.retailGrossMargin,
    subscriptionContribution: normalizedSubscriptionWeight * input.subscriptionGrossMargin,
    residualContribution: residualWeight * input.grossMargin,
  }
}

function computeMargins(input) {
  const grossBlend = blendedGrossMargin(input)
  const ebitdaMargin = grossBlend.grossMargin - input.opexRatio
  const interestPct = div(input.debt * 0.075, Math.max(input.revenue, 1))
  const netWorkingCapital = input.ar + input.inventory - input.ap
  const workingCapitalRatio = div(netWorkingCapital, Math.max(input.revenue, 1))
  const workingCapitalDrag = Math.max(workingCapitalRatio * 0.08, 0)
  const pretaxNetMargin = ebitdaMargin - interestPct
  const netMargin = pretaxNetMargin > 0 ? pretaxNetMargin * 0.79 : pretaxNetMargin
  // Customer prepayments are a distinct liability (contract liabilities / deposits), not
  // AR/AP/inventory, so this is purely additive alongside workingCapitalDrag rather than
  // netted against it. It affects CASH CONVERSION only (fcfMargin) — never revenue, and
  // never the backlog/pipeline track (pipelineBacklogTrack has its own margin math and
  // does not read fcfMargin), so a dollar of backlog is valued once via the backlog track
  // and its eventual cash timing is reflected once via this credit — not both.
  const customerPrepaymentCredit = clamp(input.customerPrepaymentPct, 0, 0.2)
  const fcfMargin = ebitdaMargin - input.capexPct - interestPct - workingCapitalDrag + customerPrepaymentCredit
  const ebitda = input.revenue * ebitdaMargin
  const netIncome = input.revenue * netMargin
  const fcf = input.revenue * fcfMargin
  const derivedEps = input.sharesOutstanding > 0 ? netIncome / input.sharesOutstanding : 0
  return {
    grossMargin: round(grossBlend.grossMargin),
    inputGrossMargin: round(input.grossMargin),
    marginBlendActive: grossBlend.blendActive,
    retailRevenuePct: round(input.retailRevenuePct),
    retailGrossMargin: round(input.retailGrossMargin),
    subscriptionRevenuePct: round(input.subscriptionRevenuePct),
    subscriptionGrossMargin: round(input.subscriptionGrossMargin),
    retailGrossContribution: round(grossBlend.retailContribution),
    subscriptionGrossContribution: round(grossBlend.subscriptionContribution),
    residualGrossContribution: round(grossBlend.residualContribution),
    ebitdaMargin: round(ebitdaMargin),
    netMargin: round(netMargin),
    fcfMargin: round(fcfMargin),
    ebitda: round(ebitda, 2),
    netIncome: round(netIncome, 2),
    fcf: round(fcf, 2),
    derivedEps: round(derivedEps, 4),
    interestPct: round(interestPct),
    netWorkingCapital: round(netWorkingCapital, 2),
    workingCapitalRatio: round(workingCapitalRatio),
    workingCapitalDrag: round(workingCapitalDrag),
    customerPrepaymentCredit: round(customerPrepaymentCredit),
    netDebt: round(input.debt - input.cash, 2),
  }
}

function computeGrowthCredibility(input, context, margins) {
  const positiveGrowth = Math.max(input.revenueGrowth, 0)
  const revenueBase = Math.max(input.revenue, 1_000)
  const baseScale = context.size.revenueScale
  const absoluteGrowth = logScore(revenueBase * positiveGrowth, 6, 1.12)
  const repeatability = weightedAverage([
    { value: input.recurringRevenuePct, weight: 0.32 },
    { value: clamp((input.nrr - 0.85) / 0.45, 0, 1), weight: 0.22 },
    { value: clamp(1 - input.churn / 0.2, 0, 1), weight: 0.18 },
    { value: clamp(div(input.pipelineValue * input.pipelineConversion, Math.max(input.revenue, 1)) / 1.75, 0, 1), weight: 0.06 },
    { value: context.relevance.maturity, weight: 0.22 },
  ])
  const marginSupport = clamp((margins.grossMargin + 0.05) / 0.8 * 0.55 + ((margins.ebitdaMargin + 0.2) / 0.5) * 0.45, 0, 1)
  const raw = weightedAverage([
    { value: baseScale, weight: 0.31 },
    { value: absoluteGrowth, weight: 0.22 },
    { value: repeatability, weight: 0.2 },
    { value: marginSupport, weight: 0.14 },
    { value: context.relevance.maturity, weight: 0.13 },
  ])
  const hypergrowthPenalty = positiveGrowth <= 0.75 ? 0 : clamp((positiveGrowth - 0.75) / 4, 0, 0.62) * (1 - baseScale) * (1.08 - repeatability * 0.5)
  const marketRoomPenalty = clamp(context.size.marketSharePosition * Math.max(positiveGrowth - 0.15, 0) * 0.22, 0, 0.18)
  const credibility = positiveGrowth > 0 ? clamp(raw - hypergrowthPenalty - marketRoomPenalty, 0.08, 1) : 1
  return {
    headline: round(input.revenueGrowth),
    effectiveGrowth: round(input.revenueGrowth >= 0 ? input.revenueGrowth * credibility : input.revenueGrowth),
    credibility: round(credibility),
    baseScale: round(baseScale),
    absoluteGrowth: round(absoluteGrowth),
    repeatability: round(repeatability),
    hypergrowthPenalty: round(hypergrowthPenalty),
    marketRoomPenalty: round(marketRoomPenalty),
    growthGap: round(positiveGrowth ? (positiveGrowth - positiveGrowth * credibility) / positiveGrowth : 0),
  }
}

function observedTradingMultiples(input, margins) {
  const observedEquity = input.marketCapOverride > 0 ? input.marketCapOverride : input.sharePrice * input.sharesOutstanding
  const observedEV = input.capitalStatus === "Public" && observedEquity > 0 ? observedEquity + input.debt - input.cash : 0
  const positiveEbitda = margins.ebitda > 0
  const positiveFcf = margins.fcf > 0
  const positiveNetIncome = margins.netIncome > 0
  const eps = input.eps || margins.derivedEps
  return {
    observedEquity: round(observedEquity, 2),
    observedEV: round(observedEV, 2),
    eps: round(eps, 4),
    evRevenue: observedEV > 0 && input.revenue > 0 ? round(observedEV / input.revenue) : 0,
    evEbitda: observedEV > 0 && positiveEbitda ? round(observedEV / margins.ebitda) : 0,
    evFcf: observedEV > 0 && positiveFcf ? round(observedEV / margins.fcf) : 0,
    pe: observedEquity > 0 && positiveNetIncome ? round(observedEquity / margins.netIncome) : input.sharePrice > 0 && eps > 0 ? round(input.sharePrice / eps) : 0,
  }
}

function peerFinancialComparison(input, context, margins, growth) {
  const sector = sectorBaseline(input)
  const observed = observedTradingMultiples(input, margins)
  const peer = {
    evRevenue: input.competitorEvRevenue > 0 ? input.competitorEvRevenue : weightedAverage([
      { value: sector.rev[0], weight: 0.4 },
      { value: sector.rev[1], weight: 0.6 },
    ]),
    evEbitda: input.competitorEvEbitda > 0 ? input.competitorEvEbitda : weightedAverage([
      { value: sector.ebitda[0], weight: 0.42 },
      { value: sector.ebitda[1], weight: 0.58 },
    ]),
    evFcf: input.competitorEvFcf > 0 ? input.competitorEvFcf : weightedAverage([
      { value: sector.fcf[0], weight: 0.42 },
      { value: sector.fcf[1], weight: 0.58 },
    ]),
    pe: input.competitorPe,
    revenueGrowth: input.competitorRevenueGrowth,
    grossMargin: input.competitorGrossMargin,
    ebitdaMargin: input.competitorEbitdaMargin,
    netMargin: input.competitorNetMargin,
    netDebtRevenue: input.competitorNetDebtRevenue,
  }
  const companyNetDebtRevenue = div(input.debt - input.cash, Math.max(input.revenue, 1), 0)
  const hasPeerMargins = input.competitorGrossMargin !== 0 || input.competitorEbitdaMargin !== 0 || input.competitorNetMargin !== 0
  const grossScore = input.competitorGrossMargin !== 0 ? clamp(0.5 + (margins.grossMargin - input.competitorGrossMargin) / 0.35, 0, 1) : 0.5
  const ebitdaScore = input.competitorEbitdaMargin !== 0 ? clamp(0.5 + (margins.ebitdaMargin - input.competitorEbitdaMargin) / 0.28, 0, 1) : 0.5
  const netScore = input.competitorNetMargin !== 0 ? clamp(0.5 + (margins.netMargin - input.competitorNetMargin) / 0.24, 0, 1) : 0.5
  const debtScore = input.competitorNetDebtRevenue !== 0
    ? clamp(0.5 + (input.competitorNetDebtRevenue - companyNetDebtRevenue) / 1.5, 0, 1)
    : clamp(0.5 - companyNetDebtRevenue / 2.5, 0, 1)
  const growthScore = input.competitorRevenueGrowth !== 0
    ? clamp(0.5 + (growth.effectiveGrowth - input.competitorRevenueGrowth) / 0.45, 0, 1)
    : clamp(0.5 + (growth.effectiveGrowth - input.sectorCagr) / 0.45, 0, 1)
  const cashConversionScore = clamp(0.5 + (margins.fcfMargin - Math.max(input.competitorNetMargin || 0, 0)) / 0.28, 0, 1)
  const marginAdvantage = weightedAverage([
    { value: grossScore, weight: input.competitorGrossMargin !== 0 ? 0.22 : 0.08 },
    { value: ebitdaScore, weight: input.competitorEbitdaMargin !== 0 ? 0.32 : 0.12 },
    { value: netScore, weight: input.competitorNetMargin !== 0 ? 0.22 : 0.08 },
    { value: cashConversionScore, weight: margins.fcfMargin !== 0 ? 0.12 : 0.04 },
  ])
  const coreScore = weightedAverage([
    { value: marginAdvantage, weight: hasPeerMargins ? 0.42 : 0.24 },
    { value: debtScore, weight: 0.26 },
    { value: growthScore, weight: 0.2 },
    { value: context.relevance.maturity, weight: 0.07 },
    { value: clamp((margins.fcfMargin + 0.04) / 0.28, 0, 1), weight: 0.05 },
  ])
  const multipleRatios = [
    { value: div(observed.evRevenue, peer.evRevenue, 0), weight: observed.evRevenue > 0 && peer.evRevenue > 0 ? context.multipleFamilyWeights.revenue : 0 },
    { value: div(observed.evEbitda, peer.evEbitda, 0), weight: observed.evEbitda > 0 && peer.evEbitda > 0 ? context.multipleFamilyWeights.ebitda : 0 },
    { value: div(observed.evFcf, peer.evFcf, 0), weight: observed.evFcf > 0 && peer.evFcf > 0 ? context.multipleFamilyWeights.fcf : 0 },
    { value: div(observed.pe, peer.pe, 0), weight: observed.pe > 0 && peer.pe > 0 ? 0.18 : 0 },
  ]
  const observedMultipleRatio = weightedAverage(multipleRatios)
  const multiplePremium = observedMultipleRatio > 0 ? observedMultipleRatio - 1 : 0
  const justifiedPremiumCapacity = Math.max(coreScore - 0.5, 0) * 1.65 + Math.max(growthScore - 0.5, 0) * 0.45
  const unsupportedPremium = Math.max(multiplePremium - justifiedPremiumCapacity, 0)
  const undervaluationSupport = Math.max((1 - observedMultipleRatio) * clamp(coreScore + debtScore * 0.35, 0, 1.25), 0)
  return {
    observed,
    peer: {
      evRevenue: round(peer.evRevenue),
      evEbitda: round(peer.evEbitda),
      evFcf: round(peer.evFcf),
      pe: round(peer.pe),
      revenueGrowth: round(peer.revenueGrowth),
      grossMargin: round(peer.grossMargin),
      ebitdaMargin: round(peer.ebitdaMargin),
      netMargin: round(peer.netMargin),
      netDebtRevenue: round(peer.netDebtRevenue),
    },
    companyNetDebtRevenue: round(companyNetDebtRevenue),
    grossScore: round(grossScore),
    ebitdaScore: round(ebitdaScore),
    netScore: round(netScore),
    debtScore: round(debtScore),
    growthScore: round(growthScore),
    marginAdvantage: round(marginAdvantage),
    coreScore: round(coreScore),
    observedMultipleRatio: round(observedMultipleRatio),
    multiplePremium: round(multiplePremium),
    justifiedPremiumCapacity: round(justifiedPremiumCapacity),
    unsupportedPremium: round(unsupportedPremium),
    undervaluationSupport: round(undervaluationSupport),
  }
}

function signal(raw, cap, sources, layers, note) {
  const effective = clamp(raw, 0, cap)
  return {
    raw: round(raw),
    cap: round(cap),
    effective: round(effective),
    capped: raw > cap + 1e-9,
    sources,
    layers,
    note,
  }
}

function buildSignalLedger(input, context, margins, growth) {
  const tagSet = new Set(input.tags)
  const expectedPipeline = input.pipelineValue * input.pipelineConversion
  const earlyScaleRelevance = clamp(1 - context.size.sizeScore * 0.85, 0.18, 1)
  const lowCompetitionInput = 1 - (input.competitionIntensity - 1) / 4
  const privatePipelineRelevance = input.capitalStatus === "Public" ? 0.45 : 1
  const pipelineCoverage = clamp(div(expectedPipeline, Math.max(input.revenue, input.sam * 0.001, 100_000)) / 2, 0, 1)
  const pipelineMarketRoom = clamp(div(expectedPipeline, Math.max(input.sam - input.revenue, 1)) * 20, 0, 1)
  const pipelineOpportunityRaw = expectedPipeline > 0
    ? weightedAverage([
      { value: pipelineCoverage, weight: 0.38 + earlyScaleRelevance * 0.12 },
      { value: input.pipelineConversion, weight: 0.22 },
      { value: pipelineMarketRoom, weight: 0.16 + earlyScaleRelevance * 0.08 },
      { value: input.gtmScore / 10, weight: 0.14 },
      { value: privatePipelineRelevance, weight: 0.1 },
    ])
    : 0
  const workingCapitalTotal = input.ar + input.inventory + input.ap
  const workingCapitalPressureRaw = weightedAverage([
    { value: clamp(Math.max(margins.workingCapitalRatio, 0) / 0.42, 0, 1), weight: 0.42 },
    { value: clamp(div(input.ar, Math.max(input.revenue, 1)) / 0.28, 0, 1), weight: 0.22 },
    { value: clamp(div(input.inventory, Math.max(input.revenue, 1)) / 0.36, 0, 1), weight: context.modules.inventoryRelevant ? 0.22 : 0.08 },
    { value: workingCapitalTotal > 0 ? clamp(1 - div(input.ap, workingCapitalTotal), 0, 1) : 0, weight: 0.14 },
  ])
  const revenueQualityRaw = weightedAverage([
    { value: input.recurringRevenuePct, weight: context.modules.recurring ? 0.32 : 0.14 },
    { value: clamp((input.nrr - 0.85) / 0.45, 0, 1), weight: context.modules.recurring ? 0.22 : 0.08 },
    { value: clamp(1 - input.churn / 0.18, 0, 1), weight: context.modules.recurring ? 0.2 : 0.08 },
    { value: pipelineOpportunityRaw, weight: context.relevance.maturity < 0.75 ? 0.08 : 0.03 },
    { value: clamp(1 - Math.max(input.revenueGrowth < 0 ? 0.4 : 0, 0), 0, 1), weight: 0.1 },
  ])
  const netMarginQualityRaw = clamp((margins.netMargin + 0.08) / 0.42, 0, 1)
  const marginConversionRaw = margins.grossMargin > 0
    ? weightedAverage([
      { value: clamp((margins.netMargin + 0.08) / Math.max(margins.grossMargin + 0.08, 0.08), 0, 1), weight: 0.64 },
      { value: clamp((margins.fcfMargin + 0.08) / Math.max(margins.grossMargin + 0.08, 0.08), 0, 1), weight: 0.36 },
    ])
    : clamp((margins.ebitdaMargin + 0.15) / 0.45, 0, 1)
  const profitabilityRaw = weightedAverage([
    { value: clamp(margins.grossMargin / Math.max(sectorBaseline(input).gmCap, 0.2), 0, 1), weight: 0.22 },
    { value: clamp((margins.ebitdaMargin + 0.15) / 0.45, 0, 1), weight: 0.24 },
    { value: netMarginQualityRaw, weight: 0.2 },
    { value: clamp((margins.fcfMargin + 0.06) / 0.32, 0, 1), weight: 0.24 },
    { value: 1 - workingCapitalPressureRaw, weight: 0.1 },
  ])
  const capitalBurdenRaw = weightedAverage([
    { value: clamp(input.capexPct / 0.14, 0, 1), weight: 0.28 },
    { value: workingCapitalPressureRaw, weight: 0.28 },
    { value: clamp(div(Math.max(input.debt - input.cash, 0), Math.max(input.revenue, 25_000)) / 3, 0, 1), weight: 0.26 },
    { value: context.modules.assetHeavy ? 0.65 : 0.12, weight: 0.18 },
  ])
  // Capital returns / efficiency — profit earned per unit of capital, orthogonal to
  // brand. A durable brand with poor capital returns (e.g. a capital-heavy, low-FCF
  // automaker) should NOT earn a premium multiple just for being well-known; a
  // capital-light high-return compounder should. Free-cash conversion is the reliable
  // core (it captures capital intensity that raw margins miss); ROE/ROTCE refines it
  // when disclosed.
  const roeProvided = input.roe > 0 || input.rotce > 0
  const capitalReturnsRaw = weightedAverage([
    { value: clamp(div(Math.max(margins.fcfMargin, 0), Math.max(margins.grossMargin, 0.1)), 0, 1), weight: 0.45 },
    { value: clamp((margins.fcfMargin + 0.02) / 0.28, 0, 1), weight: 0.3 },
    { value: roeProvided ? clamp((Math.max(input.roe, input.rotce) - 0.05) / 0.22, 0, 1) : 0.4, weight: 0.25 },
  ])
  const sectorMomentumRaw = clamp((input.sectorCagr + 0.02) / 0.22, 0, 1)
  const companyGrowthPotentialRaw = clamp((Math.max(growth.effectiveGrowth, 0) + 0.02) / 0.62, 0, 1)
  const remainingMarketRoomRaw = clamp(1 - context.size.marketSharePosition, 0, 1)
  const marketPotentialRaw = weightedAverage([
    { value: remainingMarketRoomRaw, weight: 0.22 + earlyScaleRelevance * 0.12 },
    { value: context.size.marketSizeScore, weight: 0.2 },
    { value: sectorMomentumRaw, weight: 0.18 },
    { value: companyGrowthPotentialRaw, weight: 0.22 + earlyScaleRelevance * 0.08 },
    { value: pipelineOpportunityRaw, weight: 0.1 + earlyScaleRelevance * 0.1 },
  ])
  const decliningRevenuePressure = input.revenueGrowth < 0
    ? clamp(Math.abs(input.revenueGrowth) / 0.3, 0, 1)
    : input.profitabilityStatus === "Declining / Margin Compression" ? 0.55 : 0
  const leverageDragRaw = clamp(div(Math.max(input.debt - input.cash, 0), Math.max(input.revenue, 25_000)) / 1.75, 0, 1)
  const dividendDurabilityRaw = input.capitalStatus === "Public" && input.dividendYield > 0 && margins.fcfMargin > 0
    ? weightedAverage([
      { value: clamp(input.dividendYield / 0.045, 0, 1), weight: 0.36 },
      { value: profitabilityRaw, weight: 0.32 },
      { value: context.relevance.maturity, weight: 0.2 },
      { value: 1 - leverageDragRaw, weight: 0.12 },
    ])
    : 0
  // --- Durability sources (each raw input is owned by exactly one signal) ---
  // brandDurability: demand-side (customer trust/habit/institutional reliance/tenure/reach).
  // moatStrength: supply-side structural defensibility (switching/network/data/ip/generic moat).
  // lowDirectCompetition: market structure (competition intensity + share position).
  const brand = context.brand
  const brandDemandStickiness = div(
    (input.consumerHabitStrength / 10) * brand.consumerWeight + (input.institutionalReliance / 10) * brand.institutionalWeight,
    brand.consumerWeight + brand.institutionalWeight,
    0
  )
  const brandDurabilityRaw = weightedAverage([
    { value: clamp(input.customerTrustScore / 10, 0, 1), weight: 0.24 },
    { value: input.targetMarketRecognitionPct, weight: 0.16 },
    { value: clamp(input.missionCriticality / 10, 0, 1), weight: 0.14 },
    { value: brandDemandStickiness, weight: 0.16 },
    { value: clamp(input.purchaseFrequency / 10, 0, 1), weight: 0.12 },
    { value: brand.tenureScore, weight: 0.1 },
    { value: brand.reachScore, weight: 0.08 },
  ])
  const brandDurabilitySig = signal(
    brandDurabilityRaw,
    0.92,
    ["clientType", "customerTrustScore", "targetMarketRecognitionPct", "missionCriticality", "purchaseFrequency", "consumerHabitStrength", "institutionalReliance", "yearsOperating", "brandGeographicReach"],
    ["durability", "market", "asset", "strategic"],
    "Brand durability is one audited demand-side signal (trust, habit or institutional reliance, recognition, tenure, reach). It does not re-read moat or competition inputs."
  )
  const moatStrengthRaw = weightedAverage([
    { value: input.moatScore / 10, weight: 0.32 },
    { value: input.switchingCostScore / 10, weight: 0.24 },
    { value: input.networkEffectScore / 10, weight: 0.2 },
    { value: input.dataAdvantageScore / 10, weight: 0.14 },
    { value: input.ipScore / 10, weight: 0.1 },
  ])
  const moatStrengthSig = signal(
    moatStrengthRaw,
    0.9,
    ["moatScore", "switchingCostScore", "networkEffectScore", "dataAdvantageScore", "ipScore"],
    ["durability", "audit", "asset"],
    "Structural moat is scored once from the defensibility inputs and consumed through the shared durability composite, not as a separate comps premium."
  )
  // Single-customer concentration risk. Raw risk ramps up above a 10% revenue-share
  // materiality threshold (the standard disclosure line). It is NOT read from
  // switchingCostScore or moatScore directly — those are already owned by moatStrength —
  // this signal consumes the already-computed moatStrength COMPOSITE instead, so a
  // structural moat cannot separately inflate this discount and be re-spent here.
  // Stickiness only earns a discount off the raw penalty when the relationship is
  // EXPANDING: a merely stable concentrated customer gets no credit for the company's
  // general moat, since "hasn't left yet" is not evidence it wouldn't. This is what
  // differentiates a warehouse-robotics install base (physically embedded, high moat,
  // growing commitment) from a software vendor with the same revenue concentration but
  // low switching cost and no expansion signal — the former earns a real discount, the
  // latter does not.
  const topCustomerShare = clamp(input.topCustomerRevenuePct, 0, 1)
  const concentrationRaw = clamp((topCustomerShare - 0.1) / 0.5, 0, 1)
  const relationshipTrend = input.topCustomerRelationshipTrend
  const trendFactor = { Expanding: 0.6, Stable: 1.0, "At Risk / Contracting": 1.4 }[relationshipTrend] ?? 1.0
  const stickinessFactor = relationshipTrend === "Expanding"
    ? clamp(1 - moatStrengthSig.effective * 0.7, 0.3, 1)
    : 1
  const customerConcentrationRaw = clamp(concentrationRaw * trendFactor * stickinessFactor, 0, 1)
  const customerConcentrationSig = signal(
    customerConcentrationRaw,
    0.85,
    ["topCustomerRevenuePct", "topCustomerRelationshipTrend", "moatStrength"],
    ["risk"],
    "Single-customer concentration is one audited risk signal. A growing relationship with a structurally sticky (high-moat) customer earns a real discount off the raw concentration penalty; a stable or contracting one does not."
  )
  const lowDirectCompetitionRaw = weightedAverage([
    { value: lowCompetitionInput, weight: 0.6 },
    { value: context.size.marketSharePosition, weight: 0.24 },
    { value: tagSet.has("Multi-Location / Local Footprint") ? 0.7 : 0.42, weight: 0.16 },
  ])
  const lowDirectCompetitionSig = signal(
    lowDirectCompetitionRaw,
    0.88,
    ["competitionIntensity", "marketShare", "tags"],
    ["durability", "market", "confidence"],
    "Direct-competition position is market structure only (competition intensity and share). Moat and brand are separate signals folded in through durability."
  )
  // Single durability composite: brand, structural moat, and competition are blended
  // once, weighted by how much each matters for this business type, then consumed
  // downstream (discount rate, margins, asset backing) so none is counted twice.
  const durabilityRaw = weightedAverage([
    { value: brandDurabilitySig.effective, weight: 0.2 + brand.relevance * 0.3 },
    { value: moatStrengthSig.effective, weight: 0.2 + brand.structuralRelevance * 0.3 },
    { value: lowDirectCompetitionSig.effective, weight: 0.28 },
  ])
  const durabilitySig = signal(
    durabilityRaw,
    0.9,
    ["brandDurability", "moatStrength", "lowDirectCompetition"],
    ["intrinsic", "market", "asset"],
    "One durability number feeds discount rate, margin ceiling, and asset backing so brand, moat, and competition cannot each add the same premium."
  )
  const brandStrategicPull = brandDurabilitySig.effective * (0.4 + brand.relevance * 0.6)
  const strategicScarcityRaw = weightedAverage([
    { value: moatStrengthSig.effective, weight: 0.38 },
    { value: clamp(input.acquirerPool / 20, 0, 1), weight: 0.22 },
    { value: brandStrategicPull, weight: 0.16 },
    { value: context.relevance.strategicOptionality, weight: 0.1 },
    // Durable government backing (national champion in a regime that will honor it) is
    // real strategic protection; the same favor in a weak regime does not count here.
    { value: context.jurisdiction.durableTailwind, weight: 0.06 },
    { value: input.strategicPremiumFlag ? 0.55 : 0.12, weight: 0.08 },
  ])
  const commodityGate = COMMODITIZED_SECTORS.has(input.sector) ? 0.62 : 1
  const strategicContextCap = context.modules.rAndD || input.ipScore >= 7
    ? 0.88
    : context.modules.marketplace || input.dataAdvantageScore >= 7 || input.networkEffectScore >= 7
      ? 0.72
      : 0.5
  const tagOverlap = [
    tagSet.has("Subscription / Recurring Revenue"),
    tagSet.has("Marketplace / Two-Sided Network"),
    tagSet.has("Data / AI Advantage"),
    tagSet.has("IP / Licensing"),
    tagSet.has("Brand / Consumer Staples"),
    tagSet.has("Government / Contracted Revenue"),
  ].filter(Boolean).length
  const tagStackingPressureRaw = clamp(Math.max(tagOverlap - 1, 0) * 0.09 + (input.strategicPremiumFlag ? 0.04 : 0), 0, 1)
  const financialComparison = peerFinancialComparison(input, context, margins, growth)

  const signals = {
    growthCredibility: signal(growth.credibility, 1, ["revenueGrowth", "revenue", "pipeline", "retention"], ["intrinsic", "market"], "Headline growth is damped before it can enter any track."),
    revenueQuality: signal(revenueQualityRaw, 0.88, ["recurringRevenuePct", "nrr", "churn", "pipeline"], ["market", "confidence"], "Revenue quality has one shared budget."),
    profitabilityQuality: signal(profitabilityRaw, 0.9, ["grossMargin", "opexRatio", "capexPct"], ["intrinsic", "market"], "Margin quality has one shared budget."),
    coreFinancialJustification: signal(financialComparison.coreScore, 0.92, ["currentMultiples", "peerMultiples", "margins", "debt"], ["market", "aggregation"], "Current and peer-relative financials justify or reject valuation support once."),
    marketMultiplePressure: signal(financialComparison.unsupportedPremium, 0.9, ["currentMultiples", "peerMultiples", "margins", "debt"], ["market", "risk"], "Observed trading premium that is not justified by margins, growth, and leverage becomes one pressure signal."),
    capitalBurden: signal(capitalBurdenRaw, 0.86, ["capexPct", "workingCapital", "debt"], ["risk", "market"], "Capital intensity reduces value through one signal."),
    capitalReturns: signal(capitalReturnsRaw, 0.92, ["fcfMargin", "grossMargin", "roe", "rotce"], ["market", "risk"], "Return on capital (free-cash conversion and ROE) gates the quality multiple separately from brand, so a well-known but capital-inefficient business is not over-rewarded."),
    jurisdictionQuality: signal(clamp(context.jurisdiction.solidity + context.jurisdiction.durableTailwind * 0.15 - Math.max(-context.jurisdiction.postureBias, 0) * 0.2, 0, 1), 1, ["governanceRegime", "governmentPosture"], ["risk", "market"], "Solidity of the governing regime (rule of law, property rights, stability) sets sovereign risk and how durable any government tailwind is — state favor in a weak regime is not worth the same as a rule-of-law monopoly."),
    customerConcentration: customerConcentrationSig,
    marginConversion: signal(marginConversionRaw, 0.9, ["grossMargin", "opexRatio", "debt", "workingCapital"], ["intrinsic", "confidence"], "Gross-to-net margin conversion is scored once so margins do not get silently reused."),
    workingCapitalPressure: signal(workingCapitalPressureRaw, 0.88, ["ar", "inventory", "ap"], ["risk", "intrinsic"], "Receivables, inventory, and payables create one working-capital pressure signal."),
    marketAnchorReliability: signal(context.relevance.publicAnchor * 0.55 + context.relevance.dcfReliability * 0.3 + profitabilityRaw * 0.15, 0.9, ["capitalStatus", "profitabilityStatus"], ["aggregation"], "Market evidence gets weight only when observable and reliable."),
    sizeEvidence: signal(context.size.sizeScore, 0.92, ["revenue", "sam", "tam", "capitalStatus"], ["aggregation", "confidence"], "Size is calculated once from market share, market size, revenue scale, and public/private status."),
    sectorMomentum: signal(sectorMomentumRaw, 0.86, ["sectorCagr"], ["market", "intrinsic"], "Sector CAGR can lift or reduce multiples, but only through this shared sector momentum signal."),
    marketPotential: signal(marketPotentialRaw, 0.92, ["tam", "sam", "marketShare", "sectorCagr", "revenueGrowth", "pipeline"], ["market", "strategic"], "Remaining market room, sector CAGR, company growth, and converted pipeline create one potential signal."),
    pipelineOpportunity: signal(pipelineOpportunityRaw, input.capitalStatus === "Public" && context.size.sizeScore > 0.62 ? 0.6 : 0.92, ["pipelineValue", "pipelineConversion", "gtmScore"], ["market", "strategic"], "Expected pipeline is weighted more for smaller and private companies."),
    brandDurability: brandDurabilitySig,
    moatStrength: moatStrengthSig,
    lowDirectCompetition: lowDirectCompetitionSig,
    durability: durabilitySig,
    leverageDeclineDrag: signal(leverageDragRaw * 0.55 + decliningRevenuePressure * 0.45, 0.88, ["debt", "cash", "revenueGrowth"], ["market", "risk"], "Debt pressure and declining revenue lower valuation support through one shared drag."),
    dividendDurability: signal(dividendDurabilityRaw, 0.72, ["dividendYield", "profitabilityStatus", "fcfMargin"], ["equity", "confidence"], "A dividend from a cash-generative public company adds a modest durability signal."),
    strategicScarcity: signal(strategicScarcityRaw * commodityGate * clamp(0.35 + Math.max(growth.effectiveGrowth, 0) * 1.1, 0.28, 1), strategicContextCap, ["moat", "data", "network", "ip", "acquirerPool"], ["strategic"], "Strategic scarcity is capped across all strategic concepts."),
    executionDependency: signal(context.relevance.management * 0.55 + (input.managementScore / 10) * 0.25 + (input.capitalStatus === "SMB / Owner-Operated" ? 0.2 : 0), 0.9, ["management", "capitalStatus"], ["risk", "scorecard"], "Management matters most where dependency is real."),
    probabilityUncertainty: signal((context.modules.rAndD ? 0.35 : 0) + ((10 - input.techReadiness) / 10) * 0.32 + (input.regulatoryRisk / 5) * 0.28, 0.88, ["techReadiness", "regulatoryRisk"], ["probability", "confidence"], "Technical and regulatory uncertainty uses probability logic."),
    tagStackingPressure: signal(tagStackingPressureRaw, 0.35, ["tags"], ["audit"], "Overlapping tags consume budget instead of adding premiums."),
  }

  const strategicCapBase = context.modules.rAndD
    ? 0.42
    : context.modules.marketplace || input.dataAdvantageScore >= 7 || input.networkEffectScore >= 7
      ? 0.24
      : 0.12
  const baseStrategicCap = strategicCapBase * (0.55 + signals.strategicScarcity.effective * 0.65 + signals.marketPotential.effective * 0.24)
  const scaleAboveGrowthBase = Math.max(Math.log10(Math.max(input.revenue, 1)) - 7, 0)
  const stackingCapPenalty = 1 - signals.tagStackingPressure.effective * 1.05
  const scaleStackingPenalty = clamp(1 - signals.tagStackingPressure.effective * scaleAboveGrowthBase * 0.2, 0.78, 1)
  const penetrationCapPenalty = Math.max(context.size.marketSharePosition - 0.3, 0) * 0.7
  const largeScaleCapPenalty = Math.max(context.size.sizeScore - 0.62, 0) * 0.24
  const sizeStrategicCapMultiplier = clamp(1 - penetrationCapPenalty - largeScaleCapPenalty, 0.68, 1)
  const scaleMultipleFactor = clamp(0.97 + context.size.marketSizeScore * 0.035 + context.size.revenueScale * 0.02 - context.size.marketSharePosition * 0.055, 0.92, 1.035)
  const multipleLift = weightedAverage([
    { value: signals.coreFinancialJustification.effective, weight: 0.26 },
    { value: signals.marketPotential.effective, weight: 0.18 + earlyScaleRelevance * 0.06 },
    { value: signals.growthCredibility.effective, weight: 0.16 },
    { value: signals.profitabilityQuality.effective, weight: 0.12 },
    { value: signals.revenueQuality.effective, weight: 0.12 },
    { value: signals.sectorMomentum.effective, weight: 0.08 },
    { value: signals.durability.effective, weight: 0.08 },
    { value: signals.pipelineOpportunity.effective, weight: 0.08 + earlyScaleRelevance * 0.08 },
    { value: signals.marginConversion.effective, weight: 0.04 },
  ])
  const multipleDrag = weightedAverage([
    { value: signals.marketMultiplePressure.effective, weight: 0.28 },
    { value: signals.capitalBurden.effective, weight: 0.24 },
    { value: signals.leverageDeclineDrag.effective, weight: 0.2 },
    { value: signals.workingCapitalPressure.effective, weight: 0.12 },
    { value: signals.probabilityUncertainty.effective, weight: 0.11 },
    { value: signals.tagStackingPressure.effective, weight: 0.05 },
  ])
  const profitableOrFcfPositive = ["FCF Positive", "Profitable"].includes(input.profitabilityStatus) || margins.fcfMargin > 0
  const upsideScore = Math.max(multipleLift - 0.44, 0) * (profitableOrFcfPositive ? 2.08 : 1.8)
  const downsideScore = Math.min(multipleLift - 0.44, 0) * 1.04
  const dragCoefficient = clamp(
    0.34 -
      earlyScaleRelevance * 0.13 -
      signals.marketPotential.effective * 0.16 -
      signals.pipelineOpportunity.effective * 0.07 -
      signals.profitabilityQuality.effective * (profitableOrFcfPositive ? 0.08 : 0.03) -
      signals.durability.effective * 0.035,
    0.1,
    0.36
  )
  const qualityShield = clamp(
    1 -
      signals.profitabilityQuality.effective * (profitableOrFcfPositive ? 0.32 : 0.14) -
      signals.coreFinancialJustification.effective * (profitableOrFcfPositive ? 0.16 : 0.08) -
      signals.growthCredibility.effective * 0.12 -
      signals.marketPotential.effective * 0.1 -
      signals.durability.effective * 0.08,
    0.48,
    1
  )
  const rawMultipleScore = clamp(
    upsideScore +
      downsideScore -
      multipleDrag * dragCoefficient * qualityShield +
      signals.pipelineOpportunity.effective * earlyScaleRelevance * 0.24 +
      signals.marketPotential.effective * earlyScaleRelevance * 0.12 -
      Math.max(0.35 - signals.coreFinancialJustification.effective, 0) * 0.12,
    -1,
    1
  )
  const companyMultipleFactor = decayedMultipleFactor(rawMultipleScore, 0.25, 2.5)
  const strategicCap = clamp(baseStrategicCap * stackingCapPenalty * sizeStrategicCapMultiplier, 0.01, 0.45)
  const qualityBudget = {
    intrinsic: round(clamp(0.95 + signals.profitabilityQuality.effective * 0.085 + signals.growthCredibility.effective * 0.038 + signals.marketPotential.effective * 0.035 + signals.sectorMomentum.effective * 0.02 - signals.capitalBurden.effective * 0.03 - signals.leverageDeclineDrag.effective * 0.02 - signals.workingCapitalPressure.effective * 0.012, 0.88, 1.14)),
    market: round(clamp(0.95 + signals.coreFinancialJustification.effective * 0.095 + signals.revenueQuality.effective * 0.045 + signals.profitabilityQuality.effective * 0.04 + signals.marketPotential.effective * 0.05 + signals.pipelineOpportunity.effective * 0.025 + signals.durability.effective * 0.03 + signals.marketAnchorReliability.effective * 0.04 + signals.sizeEvidence.effective * 0.014 - signals.marketMultiplePressure.effective * 0.09 - signals.tagStackingPressure.effective * 0.05 - signals.leverageDeclineDrag.effective * 0.024, 0.84, 1.22)),
    strategic: round(clamp(0.95 + signals.strategicScarcity.effective * 0.075 + signals.marketPotential.effective * 0.09 + signals.pipelineOpportunity.effective * 0.04 + signals.growthCredibility.effective * 0.04 - signals.probabilityUncertainty.effective * 0.035, 0.88, 1.18)),
  }

  return {
    signals,
    topSignals: Object.entries(signals).map(([key, value]) => ({ key, ...value })).sort((a, b) => b.effective - a.effective).slice(0, 6),
    capsTriggered: Object.entries(signals).filter(([, value]) => value.capped).map(([key]) => key),
    budgets: {
      strategicCap: round(strategicCap),
      stackingCapPenalty: round(stackingCapPenalty),
      scaleStackingPenalty: round(scaleStackingPenalty),
      sizeStrategicCapMultiplier: round(sizeStrategicCapMultiplier),
      scaleMultipleFactor: round(scaleMultipleFactor),
      companyMultipleFactor: round(companyMultipleFactor),
      rawMultipleScore: round(rawMultipleScore),
      multipleLift: round(multipleLift),
      multipleDrag: round(multipleDrag),
      dragCoefficient: round(dragCoefficient),
      qualityShield: round(qualityShield),
      financialComparison,
      tagBudgetMultiplier: round(clamp((1 - signals.tagStackingPressure.effective * 0.09) * scaleStackingPenalty, 0.82, 1)),
      qualityBudget,
    },
    warnings: [
      signals.tagStackingPressure.effective >= 0.2 ? "Overlapping positive tags were capped by the signal ledger." : null,
      growth.growthGap > 0.45 ? "Headline growth was materially damped by growth credibility." : null,
      signals.marketPotential.capped ? "Market potential hit its cap; remaining upside is limited by the ledger." : null,
      signals.strategicScarcity.capped ? "Strategic scarcity hit its classification cap." : null,
      signals.marketMultiplePressure.effective > 0.25 ? "Observed trading multiple premium is not fully justified by peer-relative margins, growth, and leverage." : null,
    ].filter(Boolean),
  }
}

function probabilityLayers(input, context, margins, ledger) {
  const active = context.modules.rAndD || context.modules.regulated || input.lifecycleStage.includes("Pre") || input.profitabilityStatus === "Pre-Revenue"
  const tech = clamp(0.35 + input.techReadiness / 10 * 0.55 - input.regulatoryRisk * 0.035, 0.08, 0.98)
  const commercial = clamp(0.25 + context.relevance.maturity * 0.36 + ledger.signals.revenueQuality.effective * 0.18 + ledger.signals.pipelineOpportunity.effective * 0.13 + ledger.signals.marketPotential.effective * 0.06 + input.gtmScore / 10 * 0.08, 0.08, 0.98)
  const financing = clamp(0.25 + div(input.cash, Math.max(input.revenue * Math.max(input.opexRatio - margins.grossMargin, 0.05), 100_000)) * 0.17 + context.relevance.publicAnchor * 0.22 + ledger.signals.pipelineOpportunity.effective * (context.size.sizeScore < 0.5 ? 0.08 : 0.03), 0.08, 0.98)
  const combined = Math.exp((Math.log(tech) * 0.35 + Math.log(commercial) * 0.4 + Math.log(financing) * 0.25))
  const weight = active ? (context.modules.rAndD ? 0.65 : 0.35) : 0
  return {
    active,
    tech: round(tech),
    commercial: round(commercial),
    financing: round(financing),
    combined: round(combined),
    intrinsicMultiplier: round(1 - weight + weight * combined),
    marketMultiplier: round(1 - weight * 0.45 + weight * 0.45 * Math.sqrt(commercial * financing)),
    strategicMultiplier: round(1 - weight * 0.65 + weight * 0.65 * Math.sqrt(combined)),
  }
}

function discountRate(input, context, margins, ledger, growth) {
  const sector = sectorBaseline(input)
  const healthyPublic = input.capitalStatus === "Public" && ["FCF Positive", "Profitable"].includes(input.profitabilityStatus)
  const healthyLate = healthyPublic || (context.relevance.maturity > 0.65 && margins.fcfMargin > 0)
  const base = healthyPublic ? 0.055 : healthyLate ? 0.074 : 0.1
  const stageRisk = {
    "Concept / Pre-Product": 0.17,
    "Prototype / Pre-Revenue": 0.145,
    "Early Commercial": 0.105,
    Scaling: healthyLate ? 0.04 : 0.072,
    "Late-Stage Growth": healthyPublic ? 0.01 : healthyLate ? 0.026 : 0.038,
    "Profitable / Mature": healthyPublic ? 0.002 : healthyLate ? 0.018 : 0.026,
    "Declining / Turnaround": 0.055,
    Distressed: 0.14,
  }[input.lifecycleStage]
  const leverage = context.modules.financial
    ? clamp(div(Math.max(input.debt - input.cash, 0), Math.max(input.tangibleBookValue || input.revenue, 25_000)) * 0.006, 0, 0.018)
    : clamp(div(Math.max(input.debt - input.cash, 0), Math.max(input.revenue, 25_000)) * (healthyPublic ? 0.008 : 0.013), 0, healthyPublic ? 0.02 : 0.052)
  const volatility = clamp(input.churn * (healthyPublic ? 0.09 : 0.15) + (1 - input.recurringRevenuePct) * (healthyPublic ? 0.007 : 0.021), 0, healthyPublic ? 0.024 : 0.075)
  const growthAdj = growth.effectiveGrowth > 0.15 ? (healthyPublic ? -0.009 : -0.014) : growth.effectiveGrowth < 0 ? 0.035 : 0
  const potentialOffset = ledger.signals.marketPotential.effective * (context.size.sizeScore < 0.5 ? 0.03 : 0.016) + ledger.signals.pipelineOpportunity.effective * (input.capitalStatus === "Public" ? 0.008 : 0.02)
  const durabilityOffset = healthyPublic ? ledger.signals.durability.effective * 0.016 : ledger.signals.durability.effective * 0.007
  const resilience = clamp(Math.max(margins.fcfMargin, 0) * 0.05 + ledger.signals.revenueQuality.effective * 0.014 + context.relevance.publicAnchor * 0.019 + potentialOffset + durabilityOffset, 0, healthyPublic ? 0.082 : 0.068)
  // Sovereign / jurisdiction risk premium raises the rate and both its floor and
  // ceiling, so a weak-regime company is always discounted harder than an identical
  // rule-of-law one (the premium is not absorbed by the low-rate floor).
  const sovereignRiskPremium = context.jurisdiction.sovereignRiskPremium
  const floor = (healthyPublic ? (context.modules.financial ? 0.065 : ledger.signals.durability.effective > 0.72 ? 0.055 : 0.06) : healthyLate ? 0.075 : 0.11) + sovereignRiskPremium
  const ceiling = (healthyPublic ? 0.13 : healthyLate ? 0.19 : 0.58) + sovereignRiskPremium
  // Customer-concentration risk is ordinary operating risk (like leverage/volatility),
  // not a jurisdiction-level floor — it is fully mitigable by the signal's own trend and
  // stickiness dampening, so it does not also move floor/ceiling.
  const concentrationRiskPremium = ledger.signals.customerConcentration.effective * 0.035
  return {
    rate: round(clamp(base + stageRisk + sector.risk * (healthyPublic ? 0.3 : 1) + leverage + volatility + ledger.signals.probabilityUncertainty.effective * (healthyPublic ? 0.01 : 0.05) + ledger.signals.capitalBurden.effective * (healthyPublic ? 0.006 : 0.022) + growthAdj + sovereignRiskPremium + concentrationRiskPremium - resilience, floor, ceiling)),
    components: { base: round(base), stageRisk: round(stageRisk), sectorRisk: round(sector.risk * (healthyPublic ? 0.3 : 1)), leverage: round(leverage), volatility: round(volatility), growthAdj: round(growthAdj), potentialOffset: round(potentialOffset), durabilityOffset: round(durabilityOffset), sovereignRiskPremium: round(sovereignRiskPremium), concentrationRiskPremium: round(concentrationRiskPremium), resilience: round(resilience), floor: round(floor), ceiling: round(ceiling) },
  }
}

function dynamicMultiples(input, context, margins, growth, ledger) {
  const base = sectorBaseline(input)
  const growthPosition = clamp(
    0.1 +
      ledger.signals.growthCredibility.effective * 0.32 +
      ledger.signals.coreFinancialJustification.effective * 0.1 +
      ledger.signals.marketPotential.effective * 0.24 +
      ledger.signals.pipelineOpportunity.effective * 0.12 +
      clamp(Math.max(growth.effectiveGrowth, 0), 0, 1.2) * 0.09 +
      ledger.signals.sectorMomentum.effective * 0.18 -
      ledger.signals.leverageDeclineDrag.effective * 0.08 -
      ledger.signals.marketMultiplePressure.effective * 0.1,
    0,
    1
  )
  const marginPosition = clamp(ledger.signals.coreFinancialJustification.effective * 0.36 + ledger.signals.profitabilityQuality.effective * 0.46 + ledger.signals.marginConversion.effective * 0.18, 0, 1)
  // Quality position lets stable, high-margin, durable compounders earn a rich
  // multiple even at low growth (the KO problem) — decoupled from growthPosition.
  // Capital returns carry most of the weight and brand durability only a little, so a
  // well-known but capital-inefficient name (e.g. a low-FCF automaker) is not lifted
  // just for being durable — that keeps this distinct from the brand-value system.
  const qualityPosition = clamp(
    ledger.signals.capitalReturns.effective * 0.3 +
      ledger.signals.profitabilityQuality.effective * 0.28 +
      ledger.signals.coreFinancialJustification.effective * 0.18 +
      ledger.signals.durability.effective * 0.14 +
      ledger.signals.marketAnchorReliability.effective * 0.1,
    0,
    1
  )
  const revPosition = clamp(growthPosition * 0.6 + qualityPosition * 0.4, 0, 1)
  const ebitdaPosition = clamp(marginPosition * 0.78 + qualityPosition * 0.22, 0, 1)
  const profitableOrFcfPositive = ["FCF Positive", "Profitable"].includes(input.profitabilityStatus) || margins.fcfMargin > 0
  const capitalDrag = clamp(
    1 -
      ledger.signals.capitalBurden.effective * (profitableOrFcfPositive ? 0.035 : 0.06) -
      ledger.signals.workingCapitalPressure.effective * (profitableOrFcfPositive ? 0.012 : 0.02),
    profitableOrFcfPositive ? 0.92 : 0.88,
    1
  )
  const tagBudget = ledger.budgets.tagBudgetMultiplier
  // Margin durability: a company whose gross margin is high FOR ITS SECTOR earns a
  // concave lift on the applied multiple (premium names climb a little), while one
  // below its sector norm is marked down. The curve is steep near the sector norm and
  // flattens as margins rise (diminishing return on each further point of margin), so
  // the majority — sitting near their sector's typical margin — are barely affected.
  // The DOWNSIDE only bites where high margins are the expectation (software, IP,
  // pharma); low-gross, high-turnover models (retail, distribution) are quality via
  // asset turns, not margin, so their penalty is muted.
  const marginRelative = div(margins.grossMargin, Math.max(base.gmCap, 0.2), 0) - 0.85
  const highMarginNorm = ["Software / Subscription", "IP / Licensing / Royalty", "Biopharma / R&D Asset"].includes(input.businessModel) || context.modules.rAndD
  const marginQualityFactor = clamp(
    1 + Math.tanh(marginRelative * 1.6) * (marginRelative >= 0 ? 0.2 : highMarginNorm ? 0.15 : 0.05),
    0.82,
    1.16
  )
  // Cost-composition credit: R&D spend above the SECTOR-relative norm is economically
  // closer to an investment (future product/IP/capability) than a same-period cost, even
  // though GAAP expenses it immediately. rdPct is a SUBSET of opexRatio (clamped to it in
  // normalizeInputs), so it never changes grossMargin/opexRatio/EBITDA/FCF — two companies
  // with identical current profit and identical rdPct=0 get identical value from this
  // factor. Only the composition WITHIN that same total opex differs. This is a one-sided
  // CREDIT ONLY (never a penalty): a lean or labor-heavy cost structure is often simply
  // correct for that sector's business model (already reflected in a low sector norm), and
  // a "software" company that under-invests in R&D relative to peers is already penalized
  // via the gross-margin-based softwareDurabilityGate/marginQualityFactor above — adding a
  // second penalty here would double-count that specific failure mode. Sourced purely from
  // the hard rdPct input and the sector norm — never from ipScore/techReadiness/dataAdvantageScore,
  // which are separate, already-owned qualitative signals (spend is not the same question
  // as assessed output quality).
  const sectorRdNorm = SECTOR_RD_NORM[input.sector] ?? SECTOR_RD_NORM.Other
  // Small / pre-commercial biotech is excluded from the credit entirely — not given a
  // different (higher) norm, but no credit at all. R&D there is largely REGULATORY-MANDATORY
  // spend (mandated trial phases, GMP validation) to advance a candidate at all, not a
  // discretionary capital-allocation choice the way it is for a software company deciding
  // how much to fund engineering, or a mature biopharma choosing R&D over buybacks. The
  // revenue-relative ratio is also frequently undefined or meaningless at this stage
  // (pre-commercial revenue is often ~$0, so "R&D % of revenue" can be nominally 1000%+
  // without indicating anything about investment quality). These companies already receive
  // differentiated treatment via the probability-weighted tracks (MODEL_FAMILY_WEIGHTS'
  // "Biopharma / R&D Asset" heavily shifts weight to the probability-adjusted strategic/
  // pipeline tracks) — crediting heavy R&D spend again here would double-count the same
  // underlying fact through two mechanisms. Mirrors the exact commercialBiopharma test
  // already used in sectorBaseline() to distinguish mature/commercial biopharma (where the
  // 25% norm is a realistic big-pharma R&D/revenue figure) from early/clinical-stage names.
  const commercialBiopharma =
    input.sector === "Biotech Therapeutics" &&
    input.revenue > 250_000_000 &&
    input.businessModel !== "Biopharma / R&D Asset" &&
    !input.lifecycleStage.includes("Pre") &&
    input.profitabilityStatus !== "Pre-Revenue"
  const rdCreditApplicable = input.sector !== "Biotech Therapeutics" || commercialBiopharma
  const rdAboveNorm = clamp(input.rdPct - sectorRdNorm, 0, 1)
  const rdInvestmentRaw = clamp(rdAboveNorm / 0.15, 0, 1)
  const rdInvestmentFactor = rdCreditApplicable ? clamp(1 + Math.tanh(rdInvestmentRaw * 1.3) * 0.14, 1, 1.14) : 1
  // Weak-regime companies carry a minority-shareholder / rule-of-law discount on the
  // applied multiple, on top of scale, company-quality, margin-durability, and cost-
  // composition factors.
  const sizeAndCompanyFactor = ledger.budgets.scaleMultipleFactor * ledger.budgets.companyMultipleFactor * context.jurisdiction.multipleFactor * marginQualityFactor * rdInvestmentFactor
  // Software multiples additionally require software-grade GROSS margins — a "software"
  // company with a sub-software gross margin (services/acquired mix) is not premium
  // software and does not earn the full multiple.
  const softwareDurabilityGate = input.businessModel === "Software / Subscription"
    ? clamp(
      1 -
